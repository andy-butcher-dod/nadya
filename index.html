<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}img{max-width:100%}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}</style>
<title>Nadya History Practice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F5F7FC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121521" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: one-column phone app (max 480px). Gzhel blue for actions, matryoshka red/gold for the mascot, green/orange for right/wrong */
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --ink:#1E2433; --muted:#687087; --line:#DCE1EB;
  --blue:#2D5BD7; --blue-d:#1E42A3; --blue-soft:#E7EDFF;
  --green:#36A256; --green-d:#267A40; --green-soft:#E2F5E7;
  --orange:#E35D38; --orange-d:#B04426; --orange-soft:#FDE8E1;
  --flame:#FF8A1E; --gold:#F4B740; --gold-soft:#FFF4D6; --gold-ink:#6B4A00; --line2:#B9C1D3;
  --blue-ink:#1E42A3; --green-ink:#267A40; --green-line:#A9D9B6; --orange-ink:#B04426; --orange-line:#F0B7A4;
  --doll:#D9383A; --doll-d:#A9252B; --cream:#FFF4E0; --hair:#5A3A26; --cheek:#F48C8C; --tear:#5DB7F0;
  --font:"Nunito",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#121521; --surface:#1C2030; --ink:#ECEEF4; --muted:#9BA2B6; --line:#2F3549;
  --blue:#5B83F0; --blue-d:#3758BC; --blue-soft:#1F2A4A;
  --green:#4CC173; --green-d:#2E8A4F; --green-soft:#17301F;
  --orange:#F27D58; --orange-d:#B5532F; --orange-soft:#3A2119; --flame:#FF9A3C; --gold-soft:#3A2F14; --gold-ink:#F4C766; --line2:#4A526A; --blue-ink:#A9C0FF; --green-ink:#7FD69C; --green-line:#2E6B42; --orange-ink:#F49A7C; --orange-line:#7A3A26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121521; --surface:#1C2030; --ink:#ECEEF4; --muted:#9BA2B6; --line:#2F3549;
  --blue:#5B83F0; --blue-d:#3758BC; --blue-soft:#1F2A4A;
  --green:#4CC173; --green-d:#2E8A4F; --green-soft:#17301F;
  --orange:#F27D58; --orange-d:#B5532F; --orange-soft:#3A2119; --flame:#FF9A3C; --gold-soft:#3A2F14; --gold-ink:#F4C766; --line2:#4A526A; --blue-ink:#A9C0FF; --green-ink:#7FD69C; --green-line:#2E6B42; --orange-ink:#F49A7C; --orange-line:#7A3A26; color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:17px;line-height:1.45;font-weight:600}
#app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px 4px}
.stat{display:inline-flex;align-items:center;gap:6px;font-weight:900;font-size:18px;font-variant-numeric:tabular-nums}
.stat svg{width:24px;height:24px}
.stat.off{color:var(--muted)}
.iconbtn{appearance:none;border:0;background:none;padding:6px;border-radius:10px;cursor:pointer;color:var(--muted);display:inline-flex}
.iconbtn svg{width:24px;height:24px}

/* Mascot */
.stage{display:grid;justify-items:center;gap:6px;margin-top:6px}
.bubble{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 16px;font-weight:800;font-size:17px;text-align:center;max-width:320px;text-wrap:balance}
.bubble::after{content:"";position:absolute;left:50%;bottom:-9px;width:16px;height:16px;background:var(--surface);border-right:2px solid var(--line);border-bottom:2px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.mascot{width:min(200px,52vw);height:auto;overflow:visible}
.mascot .doll{transform-origin:100px 232px;transform-box:view-box}
.mascot .eyes{transform-origin:100px 76px;transform-box:view-box}
.mascot .arm{transform-origin:150px 128px;transform-box:view-box}
.mascot [data-show]{display:none}
.mascot[data-mood="hello"] [data-show~="hello"],
.mascot[data-mood="happy"] [data-show~="happy"],
.mascot[data-mood="celebrate"] [data-show~="celebrate"],
.mascot[data-mood="waiting"] [data-show~="waiting"],
.mascot[data-mood="worried"] [data-show~="worried"],
.mascot[data-mood="sad"] [data-show~="sad"],
.mascot[data-mood="miserable"] [data-show~="miserable"],
.mascot[data-mood="right"] [data-show~="right"],
.mascot[data-mood="wrong"] [data-show~="wrong"],
.mascot[data-mood="laugh"] [data-show~="laugh"]{display:inline}
.mascot[data-mood="miserable"]{filter:saturate(.35)}
.mascot[data-mood="sad"]{filter:saturate(.75)}
@media (prefers-reduced-motion:no-preference){
  .mascot .doll{animation:bob 2.4s ease-in-out infinite}
  .mascot[data-mood="happy"] .doll,.mascot[data-mood="hello"] .doll,.mascot[data-mood="right"] .doll{animation:rock 1.6s ease-in-out infinite}
  .mascot[data-mood="celebrate"] .doll{animation:jump .9s ease-in-out infinite}
  .mascot[data-mood="laugh"] .doll{animation:giggle .26s ease-in-out infinite}
  .mascot[data-mood="worried"] .doll{animation:fidget .5s ease-in-out infinite}
  .mascot[data-mood="sad"] .doll{animation:droop 4s ease-in-out infinite}
  .mascot[data-mood="miserable"] .doll{animation:droop 6s ease-in-out infinite}
  .mascot[data-mood="wrong"] .doll{animation:shake .5s ease-in-out 1}
  .mascot .eyes{animation:blink 4.5s infinite}
  .mascot .arm{animation:wave 1s ease-in-out infinite}
  .mascot .tear{animation:tear 2.2s ease-in infinite}
  .mascot .tear.t2{animation-delay:1.1s}
}
@keyframes giggle{0%,100%{transform:rotate(-4deg) translateY(0)}50%{transform:rotate(4deg) translateY(-6px)}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes rock{25%{transform:rotate(-5deg)}75%{transform:rotate(5deg)}}
@keyframes jump{0%,100%{transform:translateY(0) scale(1,1)}20%{transform:translateY(0) scale(1.06,.92)}50%{transform:translateY(-22px) scale(.96,1.05)}80%{transform:translateY(0) scale(1.04,.95)}}
@keyframes fidget{50%{transform:translateX(2px) rotate(1deg)}}
@keyframes droop{0%,100%{transform:rotate(-4deg) translateY(3px)}50%{transform:rotate(-2deg) translateY(6px)}}
@keyframes shake{20%{transform:rotate(-6deg)}40%{transform:rotate(6deg)}60%{transform:rotate(-4deg)}80%{transform:rotate(3deg)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{50%{transform:rotate(-28deg)}}
@keyframes tear{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(34px);opacity:0}}

/* Home */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:12px 10px;margin-top:16px}
.day{display:grid;justify-items:center;gap:4px;font-size:12.5px;color:var(--muted);font-weight:800}
.dot{width:30px;height:30px;border-radius:50%;background:var(--line);display:grid;place-items:center}
.dot.done{background:var(--flame)}
.dot.done svg{width:16px;height:16px}
.dot.today{box-shadow:0 0 0 3px var(--blue-soft),0 0 0 5px var(--blue)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:16px}
.seg button{appearance:none;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 6px;font-weight:800;font-size:14.5px;cursor:pointer;box-shadow:0 3px 0 var(--line);line-height:1.2}
.seg button small{display:block;font-weight:700;font-size:12px;color:var(--muted)}
.seg button[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue)}
.btn{appearance:none;border:0;width:100%;background:var(--blue);color:#fff;border-radius:16px;padding:15px 18px;font-weight:900;font-size:17px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer;box-shadow:0 5px 0 var(--blue-d);transition:transform .05s}
.btn:active{transform:translateY(5px);box-shadow:none}
.btn:disabled,.btn.green:disabled{background:var(--line);color:var(--muted);box-shadow:0 5px 0 var(--line);cursor:default}
.btn.green{background:var(--green);box-shadow:0 5px 0 var(--green-d)}
.btn.orange{background:var(--orange);box-shadow:0 5px 0 var(--orange-d)}
.btn.ghost{background:transparent;color:var(--blue);box-shadow:none;border:2px solid var(--line)}
.cta{margin-top:18px;display:grid;gap:10px}
.sub{font-size:14px;color:var(--muted);text-align:center}
.progress{margin-top:22px;display:grid;gap:12px}
.progress h2{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0;font-weight:900}
.unitrow{display:grid;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.unitrow .lbl{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:15px}
.unitrow .lbl span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--gold);border-radius:99px;transition:width .4s}
.bar i.st{opacity:.35}
.legend{font-size:13px;color:var(--muted)}

/* Lesson */
.lhead{display:flex;align-items:center;gap:12px;padding-block:8px}
.lbar{flex:1;height:16px;border-radius:99px;background:var(--line);overflow:hidden}
.lbar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .35s;box-shadow:inset 0 4px 0 rgba(255,255,255,.25)}
.qtype{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--blue);font-weight:900;margin-top:14px}
.qtitle{font-size:23px;font-weight:900;line-height:1.2;margin:6px 0 12px;text-wrap:balance}
.clue{background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:14px 16px;font-size:17px;line-height:1.5;font-weight:600}
.clue .when{display:block;width:fit-content;background:var(--gold);color:#3A2A08;font-weight:900;font-size:14px;border-radius:99px;padding:2px 10px;margin-bottom:8px;font-variant-numeric:tabular-nums}
.clue .tag{display:block;font-size:12.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:900;margin-bottom:4px}
.opts{display:grid;gap:10px;margin-top:16px}
.opts.years{grid-template-columns:1fr 1fr}
.opt{appearance:none;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:13px 15px;font-weight:800;font-size:16.5px;cursor:pointer;box-shadow:0 3px 0 var(--line);line-height:1.3}
.years .opt{text-align:center;font-size:22px;font-variant-numeric:tabular-nums}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-soft);box-shadow:0 3px 0 var(--blue)}
.opt.right{border-color:var(--green);background:var(--green-soft);box-shadow:0 3px 0 var(--green)}
.opt.wrong{border-color:var(--orange);background:var(--orange-soft);box-shadow:0 3px 0 var(--orange)}
.opt:disabled{cursor:default}
.slots{display:grid;gap:8px;margin-top:14px}
.slot{min-height:54px;border:2px dashed var(--line);border-radius:14px;display:flex;align-items:center;gap:10px;padding:8px 12px;color:var(--muted);font-weight:800}
.slot b{font-size:14px;width:24px;height:24px;border-radius:50%;background:var(--line);color:var(--ink);display:grid;place-items:center;flex:none}
.slot.filled{border-style:solid;color:var(--ink);background:var(--surface);cursor:pointer}
.slot.filled b{background:var(--blue);color:#fff}
.slot.right{border-color:var(--green);background:var(--green-soft)}
.slot.wrong{border-color:var(--orange);background:var(--orange-soft)}
.spacer{flex:1;min-height:20px}
.foot{position:sticky;bottom:0;padding-block:14px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg)}

/* Feedback sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(18px + env(safe-area-inset-bottom,0px))}
.sheet.ok{background:var(--green-soft)}
.sheet.no{background:var(--orange-soft)}
.sheet .in{max-width:448px;margin:0 auto;display:grid;gap:10px}
.sheet .hd{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:900}
.sheet.ok .hd{color:var(--green)}
.sheet.no .hd{color:var(--orange)}
.sheet .hd .mascot{width:56px}
.fact{font-size:15.5px;line-height:1.45;font-weight:600}
.fact strong{font-weight:900}
.fact .d{color:var(--muted);font-weight:800}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}}
/* Answer-sheet timeline strip and ruler */
.sheet{max-height:92vh;overflow-y:auto}
.strip{background:var(--surface);border-radius:16px;padding:12px 8px 10px;position:relative;display:grid;gap:2px}
.shead{display:flex;justify-content:space-between;gap:8px;padding:0 10px 6px;font-size:12.5px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.slist::before{content:"";position:absolute;left:98px;top:40px;bottom:18px;width:2px;background:var(--line)}
.srow{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:12px;border:2px solid transparent;position:relative}
.sd{width:66px;flex:none;text-align:right;font-size:12.5px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums;line-height:1.2}
.sdot{width:10px;height:10px;border-radius:50%;background:var(--line2);flex:none;box-shadow:0 0 0 3px var(--surface);position:relative;z-index:1}
.st{font-size:14.5px;font-weight:700;line-height:1.25;min-width:0}
.srow.cur{background:var(--gold-soft);border-color:var(--gold);padding-block:8px}
.srow.cur .sd{color:var(--gold-ink)}
.srow.cur .st{font-weight:900}
.srow.cur .sdot{width:14px;height:14px;margin:0 -2px;background:var(--gold);box-shadow:0 0 0 3px var(--gold-soft),0 0 0 5px var(--gold)}
.srow.guess{border:2px dashed var(--orange)}
.srow.guess .sd,.srow.guess .st{color:var(--orange-ink);font-weight:800}
.srow.guess .sdot{background:var(--surface);box-shadow:0 0 0 2px var(--orange)}
.ruler{position:relative;height:156px;margin:2px 10px 4px}
.rline{position:absolute;left:5%;right:5%;top:74px;height:2px;background:var(--line2)}
.rtick{position:absolute;top:70px;width:2px;height:10px;margin-left:-1px;background:var(--line2)}
.rdot{position:absolute;top:67px;width:16px;height:16px;margin-left:-8px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--gold)}
.rlab{position:absolute;max-width:46%;font-size:13.5px;font-weight:800;line-height:1.2}
.rlab b{display:block;font-size:12px;font-weight:900;color:var(--gold-ink)}
.rlab.up{bottom:96px}
.rlab.dn{top:98px}
.rstem{position:absolute;width:2px;margin-left:-1px;background:var(--gold)}
.rstem.up{top:60px;height:8px}
.rstem.dn{top:84px;height:14px}
.rgap{position:absolute;top:64px;transform:translateX(-50%);background:var(--blue-soft);color:var(--blue-ink);font-size:11.5px;font-weight:900;border-radius:99px;padding:3px 8px;white-space:nowrap}
.btns{display:grid;grid-template-columns:2fr 3fr;gap:10px}
.btn.tl{display:flex;align-items:center;justify-content:center;gap:6px;background:var(--surface);font-size:15px;letter-spacing:.04em;padding:13px 8px}
.btn.tl svg{width:18px;height:18px;flex:none}
.btn.tl.g{color:var(--green-ink);border:2px solid var(--green-line);box-shadow:0 4px 0 var(--green-line)}
.btn.tl.o{color:var(--orange-ink);border:2px solid var(--orange-line);box-shadow:0 4px 0 var(--orange-line)}

/* Timeline view */
.tlo{position:fixed;inset:0;z-index:40;background:var(--bg);overflow-y:auto;overscroll-behavior:contain}
.tlo .wrapper{max-width:480px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(40px + env(safe-area-inset-bottom,0px))}
.tlhead{position:sticky;top:0;z-index:2;background:var(--bg);padding-top:calc(12px + env(safe-area-inset-top,0px));padding-bottom:10px;border-bottom:2px solid var(--line);display:grid;gap:10px}
.tlhead .r1,.tlhead .r2{display:flex;align-items:center;justify-content:space-between;gap:10px}
.tlhead h1{margin:0;font-size:24px;font-weight:900}
.tlhead .meta{font-size:13px;font-weight:800;color:var(--muted);text-align:right}
.backbtn{display:inline-flex;align-items:center;gap:6px;border:0;background:var(--blue);color:#fff;border-radius:99px;padding:9px 14px 9px 10px;font-weight:900;font-size:14.5px;box-shadow:0 3px 0 var(--blue-d);cursor:pointer}
.backbtn svg{width:18px;height:18px}
.tlhead .seg{margin-top:0;grid-template-columns:1fr 1fr}
.tlyr{display:grid;grid-template-columns:52px minmax(0,1fr);gap:0 14px;padding-top:14px}
.tlyr .y{font-size:22px;font-weight:900;padding-top:6px;font-variant-numeric:tabular-nums}
.tlevs{display:flex;flex-direction:column;gap:8px;border-left:2px solid var(--line);padding-left:16px;min-width:0}
.tev{position:relative;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:9px 14px}
.tev::before{content:"";position:absolute;left:-25px;top:15px;width:10px;height:10px;border-radius:50%;background:var(--line2);box-shadow:0 0 0 3px var(--bg)}
.tev summary{list-style:none;cursor:pointer;display:grid;gap:2px}
.tev summary::-webkit-details-marker{display:none}
.tev .drow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tev .d{font-size:12.5px;font-weight:900;color:var(--orange-ink);letter-spacing:.02em}
.tev .h{font-size:15.5px;font-weight:800;line-height:1.25}
.tev p{margin:8px 0 0;font-size:14.5px;font-weight:600;line-height:1.45}
.tev p.w{color:var(--muted)}
.tev p.w strong{color:var(--ink)}
.tev.cur{background:var(--gold-soft);border-color:var(--gold);box-shadow:0 4px 0 var(--gold);scroll-margin-top:180px}
.tev.cur::before{width:14px;height:14px;left:-27px;top:13px;background:var(--gold)}
.tev.cur .d{color:var(--gold-ink)}
.tev.cur .h{font-size:17px;font-weight:900}
.chip{font-size:11.5px;font-weight:900;background:var(--blue);color:#fff;border-radius:99px;padding:2px 8px;white-space:nowrap}

@keyframes up{from{transform:translateY(100%)}}

/* Complete */
.done-wrap{flex:1;display:grid;align-content:center;justify-items:center;gap:14px;text-align:center}
.done-wrap h1{font-size:30px;font-weight:900;margin:0;color:var(--gold);text-wrap:balance}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%}
.tile{border:2px solid var(--c);border-radius:16px;overflow:hidden;background:var(--surface)}
.tile .t{background:var(--c);color:#fff;font-size:12px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;padding:4px}
.tile .v{font-size:24px;font-weight:900;padding:8px 4px;font-variant-numeric:tabular-nums}

/* Browse */
.blist{display:grid;gap:8px;margin-top:12px}
.bitem{background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:10px 14px}
.bitem summary{cursor:pointer;list-style:none;display:grid;gap:2px}
.bitem summary::-webkit-details-marker{display:none}
.bitem .d{font-size:13px;color:var(--orange);font-weight:900;letter-spacing:.02em}
.bitem .h{font-weight:800}
.bitem p{margin:8px 0 0;font-size:15.5px;font-weight:600}
.bitem p.w{color:var(--muted)}
.mini{display:inline-block;font-size:11.5px;font-weight:900;padding:1px 7px;border-radius:99px;background:var(--gold);color:#3A2A08;margin-left:6px;vertical-align:middle}

.chcard{appearance:none;width:100%;text-align:left;font:inherit;font-weight:800;font-size:15px;line-height:1.25;color:var(--ink);background:var(--blue-soft);border:2px solid var(--blue);border-radius:14px;padding:10px 14px;box-shadow:0 3px 0 var(--blue);touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}

.reset{appearance:none;border:0;background:none;color:var(--muted);font-size:13px;text-decoration:underline;cursor:pointer;margin-top:28px;justify-self:center}

<script>
const TOPICS={
 a:["Tsarist rule in Russia, 1905–14","Impact of war & the February Revolution, 1914–17","Provisional Government & the Bolshevik Revolution","Bolshevik consolidation of power & the Civil War","War Communism & the NEP"],
 b:["The leadership struggle, 1924–29","Five-Year Plans & collectivisation","Purges, show trials, the cult of Stalin & the revision of history","Life in the Soviet Union, 1924–41","The Second World War & after, 1941–53"]
};
// [year, date, key topic, title, what happened, why it matters]
const EV={a:[
[1903,"1903",1,"Social Democrats split: Bolsheviks and Mensheviks","The Social Democrats (founded 1898, followers of Karl Marx) split in two. Lenin’s Bolsheviks wanted to lead a workers’ revolution as soon as the time was right; the Mensheviks believed it would be a long time before Russia was industrialised enough for one.","Background to the growth of opposition groups. Other groups: the Socialist Revolutionaries (SRs), who appealed to peasants, and the liberals, who became the Kadets and Octobrists in 1905."],
[1904,"Feb 1904 – Sep 1905",1,"Russo-Japanese War","Russia was beaten by Japan. Port Arthur fell and the Baltic Fleet was destroyed at Tsushima (May 1905).","A humiliating defeat that damaged the Tsar’s prestige and caused shortages and rising prices: a key reason for discontent in 1905."],
[1905,"9 Jan 1905",1,"Bloody Sunday","Father Gapon led a peaceful march of workers and their families to the Winter Palace in St Petersburg, with a petition signed by 150,000 people. Cossacks charged and soldiers fired into the crowd: over 100 people were killed and hundreds wounded.","Destroyed the image of the Tsar as the ‘Little Father’ who cared for his people. More than 400,000 workers went on strike in January 1905 alone."],
[1905,"14 Jun 1905",1,"Potemkin Mutiny","Sailors on the battleship Potemkin mutinied over maggot-infested meat, killed some of their officers and sailed to Odessa, where riots broke out. Troops fired on the crowds, killing over 1,000 people. In July the mutineers reached Romania and sank the ship rather than hand it back.","Showed that even the armed forces could turn against the Tsar. But most of the army stayed loyal in 1905."],
[1905,"Sep – Oct 1905",1,"General strike and the St Petersburg Soviet","A general strike, joined by the railway workers, brought Russia to a standstill. Workers set up the St Petersburg Soviet (council) to organise the strike in the city; Trotsky became its chairman.","The first soviet. It became the model for the Petrograd Soviet in 1917."],
[1905,"17 Oct 1905",1,"The October Manifesto","Advised by Sergei Witte, Nicholas promised civil rights (free speech, freedom of assembly) and an elected parliament called the Duma.","It split the opposition. Liberals were mostly satisfied, so the Tsar could turn on the workers and peasants. A main reason Nicholas survived 1905."],
[1905,"Dec 1905",1,"The 1905 Revolution crushed","The leaders of the St Petersburg Soviet were arrested. An armed rising organised by the Social Democrats in Moscow failed, with more than 1,000 people killed by tsarist troops. Soldiers were sent into the countryside to crush peasant unrest.","The army stayed loyal, and troops returning from the Far East helped. Together with the October Manifesto, this explains why Nicholas survived."],
[1906,"Apr 1906",1,"The Fundamental Laws","Days before the First Duma met, Nicholas declared that ‘supreme autocratic power’ belonged to the Tsar. He could dissolve the Duma and make laws when it was not sitting (Article 87).","Showed that Nicholas never meant to share real power. It undermined the promises of the October Manifesto."],
[1906,"Apr – Jul 1906",1,"The First Duma","Dominated by the liberal Kadets, it demanded land reform and more power. Nicholas dissolved it after just 10 weeks.","Showed Nicholas’s attitude to the dumas: he closed any duma that challenged him."],
[1906,"Jul 1906",1,"Stolypin becomes Prime Minister","Pyotr Stolypin combined harsh repression with reform: order first, then change.","His mix of harsh repression (‘Stolypin’s necktie’) and land reform (the ‘wager on the strong’) helped the Tsar regain control after 1905, until Stolypin was assassinated in 1911."],
[1906,"1906 – 1909",1,"Stolypin’s repression","Special army courts tried suspected revolutionaries with no lawyers and no appeal. Over a thousand people were executed in 1906–07 and many thousands more exiled to Siberia. The hangman’s noose became known as ‘Stolypin’s necktie’. Newspapers and trade unions were shut down.","Restored order and weakened the revolutionaries, but increased hatred of the regime."],
[1906,"Nov 1906",1,"Stolypin’s land reform","Peasants could leave the mir (village commune) and join their strips of land into one farm of their own. Stolypin called it his ‘wager on the strong’: successful farmers would stop rebelling and support the government.","Grain output rose, but by May 1915 only 14% of peasants taking up the reform had combined their land into individual farms. In 1917 peasant unrest swept the countryside again."],
[1907,"Feb – Jun 1907",1,"The Second Duma","Even more radical than the first, with many socialists. Dissolved after about three months.","More evidence that Nicholas would not work with a critical duma."],
[1907,"3 Jun 1907",1,"Voting rules changed","Stolypin changed the election rules so that conservatives, not reformers, were elected. The Octobrists and other conservatives now controlled 287 of the 443 duma seats.","Produced a much more loyal Third Duma. Liberals were shocked at such a dishonest way to control the duma."],
[1907,"Nov 1907 – Jun 1912",1,"The Third Duma","Conservative and cooperative; it served its full five-year term and passed some reforms, such as workers’ insurance and more primary schools.","Showed that a duma could survive if it did not challenge the Tsar."],
[1911,"Sep 1911",1,"Stolypin assassinated","Shot at the opera in Kiev, with the Tsar in the audience. Revolutionaries, including the terrorist wing of the Socialist Revolutionaries, had long targeted him.","Nicholas had already lost confidence in him. Reform lost its driving force."],
[1912,"Apr 1912",1,"Lena Goldfields Massacre","Gold miners in Siberia protested about rotten horsemeat and terrible conditions, and went on strike with Bolshevik help. Troops fired on a huge crowd of strikers: between 200 and 500 were killed and hundreds more wounded.","Strikes had fallen to a few hundred in 1911; after the massacre there were nearly 2,000, and thousands of protest meetings. It felt as if nothing had changed since Bloody Sunday."],
[1912,"Nov 1912 – Feb 1917",1,"The Fourth Duma","Conservative, but it became more and more critical of the government once war began.","Its members later formed the Progressive Bloc (1915) and the Provisional Committee (1917)."],
[1914,"Aug 1914",2,"Russia enters the First World War","Russia went to war against Germany and Austria-Hungary. There was a wave of patriotism, and St Petersburg was renamed Petrograd to sound less German.","The war brought huge losses, food shortages and soaring prices, and turned many Russians against the Tsar. Within three years he had lost his throne."],
[1914,"26 – 30 Aug 1914",2,"Battle of Tannenberg","The Germans won a stunning victory in East Prussia. Russia lost 122,000 men: around 30,000 killed and the rest captured. The Russian commander was so ashamed that he killed himself.","Exposed poor leadership, communications and supplies in the Russian army."],
[1915,"1915",2,"The Great Retreat and shortages","By the end of 1915 Russia had lost 2 million men and was in retreat. Over 15 million men were called up, so factories and farms lost workers: over 500 factories closed in 1915. The government printed money, causing inflation, and the railways could not get enough food to the cities.","Military effects: huge losses and falling morale. Economic and social effects: shortages, inflation and hunger in the cities."],
[1915,"Aug 1915",2,"The Progressive Bloc","The duma demanded a government of duma deputies that the people could trust. The Tsar refused, so around half the deputies formed the Progressive Bloc, which became a centre of opposition.","A political effect of the war: even moderate supporters of the monarchy turned against the Tsar’s government."],
[1915,"Aug 1915",2,"Nicholas takes command of the army","Against the advice of his ministers and the duma, the Tsar took personal command of the army and navy, despite having no military experience. He moved to army headquarters at Mogilev.","He was now blamed personally for every defeat, and he left the German-born Tsarina Alexandra in charge in Petrograd."],
[1915,"1915 – 1916",2,"Rasputin’s influence","Alexandra relied on Rasputin, a Siberian peasant-monk who seemed able to help her son Alexei’s haemophilia. She took his advice on ministers: between August 1915 and December 1916 she appointed four prime ministers and three ministers of war.","Rumours about Rasputin and the ‘German woman’ badly damaged the royal family’s reputation."],
[1916,"Jun – Sep 1916",2,"Brusilov Offensive","Russia’s most successful attack of the war, but it cost around a million casualties.","Afterwards army morale collapsed and desertions rose."],
[1916,"Dec 1916",2,"Rasputin murdered","A group of aristocrats murdered Rasputin, hoping to save the monarchy. His body was found under the ice of the River Neva.","Too late to repair the damage. Showed that even the aristocracy had lost faith in the Tsar."],
[1917,"Winter 1916–17",2,"Food and fuel crisis in Petrograd","A very harsh winter. Bread queues grew, fuel ran short and prices rose much faster than wages.","The immediate economic cause of the February Revolution."],
[1917,"18 – 23 Feb 1917",2,"Strikes and International Women’s Day","Workers at the giant Putilov works went on strike. On 23 February, thousands of women marched against bread shortages and joined the strikers. The government announced bread rationing from 1 March, which made people desperate.","The start of the February Revolution in Petrograd."],
[1917,"23 – 25 Feb 1917",2,"Mass protests in Petrograd","A quarter of a million people joined the strikes and protests, and the city came to a standstill. Nicholas, at army headquarters, ordered the protests to be put down by force.","His order led directly to the army mutiny."],
[1917,"26 – 27 Feb 1917",2,"The army mutiny","On 26 February, soldiers of the Pavlovsky Regiment refused to obey orders after another regiment shot more than 50 protesters. On 27 February whole regiments mutinied and joined the crowds: around 150,000 soldiers in all.","The decisive moment: the Tsar had lost control of the army in the capital."],
[1917,"27 Feb 1917",2,"Petrograd Soviet and the Duma Committee set up","Workers and soldiers formed the Petrograd Soviet. Duma members formed a Provisional Committee to take charge.","The beginning of ‘Dual Control’ (also called Dual Power): the Provisional Government had to share power with the Petrograd Soviet."],
[1917,"1 Mar 1917",2,"Order No. 1","The Petrograd Soviet told soldiers to obey the Provisional Government only if the Soviet agreed with its orders.","Gave the Soviet control of the army: a major weakness of the Provisional Government under Dual Control."],
[1917,"2 Mar 1917",2,"Nicholas II abdicates","At Pskov, senior army officers and duma members urged Nicholas to abdicate. He gave up the throne in favour of his brother, Grand Duke Michael, who turned it down.","Ended over 300 years of Romanov rule."],
[1917,"2 Mar 1917",2,"Provisional Government formed","Led by Prince Lvov, made up mainly of liberal Duma members, with Kerensky as the only socialist. It was meant to govern until a Constituent Assembly was elected.","It was not elected, so it lacked authority and had to share power with the Petrograd Soviet."],
[1917,"3 – 4 Apr 1917",3,"Lenin returns: the April Theses","The Germans let Lenin travel back from Switzerland. Arriving at the Finland Station on 3 April, he set out the April Theses: no co-operation with the Provisional Government, and the slogans ‘Peace, Land and Bread’ and ‘All Power to the Soviets’.","Gave the Bolsheviks clear, popular aims that set them apart from every other party."],
[1917,"Jun 1917",3,"The June Offensive fails","Kerensky, War Minister since May, launched an offensive against the Austrians and Germans. It was a disaster: the front collapsed and the army was pushed back hundreds of kilometres.","Continuing the war was a major mistake. By October 1917 over 2 million soldiers had deserted."],
[1917,"3 – 7 Jul 1917",3,"The July Days","An uprising in Petrograd, caused by food shortages, the failed June Offensive and Bolshevik propaganda. The government published documents claiming Lenin was a German agent. Troops surrounded the Bolshevik headquarters and hundreds of Bolsheviks were arrested, including Trotsky.","A setback for the Bolsheviks: Lenin fled to Finland on 5 July."],
[1917,"Jul 1917",3,"Kerensky becomes Prime Minister","Kerensky took much of the credit for putting down the July Days and replaced Prince Lvov as leader of the Provisional Government.","He kept Russia in the war and delayed land reform and elections."],
[1917,"Aug 1917",3,"The Kornilov Revolt","On 18 July Kerensky made General Kornilov commander-in-chief. Kornilov wanted to break the power of the soviets, so Kerensky dismissed him, but on 24 August Kornilov sent troops to Petrograd anyway. Kerensky released Bolshevik prisoners and armed the Red Guards; the troops never arrived.","A turning point: the Bolsheviks looked like the defenders of the revolution, they were now armed, and Kerensky lost the army’s trust."],
[1917,"Sep 1917",3,"Bolsheviks win the soviets","The Bolsheviks won control of the Petrograd Soviet, and on 25 September Trotsky was elected its president. Party membership grew from 24,000 at the start of 1917 to 340,000 by October.","Gave them a power base and a claim to act in the soviets’ name."],
[1917,"10 Oct 1917",3,"The decision to seize power","Lenin returned to Petrograd in disguise and persuaded the Bolshevik Central Committee to vote 10–2 for an armed rising. Kamenev and Zinoviev voted against.","Shows Lenin’s role: he pushed the party into acting."],
[1917,"Oct 1917",3,"Military Revolutionary Committee","The Petrograd Soviet set up the Military Revolutionary Committee (MRC), led by Trotsky, to bring together the soldiers who supported the soviet. By 21 October most of Petrograd’s regiments had promised it their loyalty.","Shows Trotsky’s role in the success of the revolution."],
[1917,"24 – 25 Oct 1917",3,"The Bolshevik takeover","Red Guards and soldiers seized bridges, railway stations, the telephone exchange and government buildings. The Winter Palace was taken on the night of 25–26 October. Kerensky fled.","A well-planned operation with very little bloodshed: few defended the Provisional Government."],
[1917,"26 Oct 1917",3,"Sovnarkom and the first decrees","Lenin formed a Bolshevik government, the Council of People’s Commissars (Sovnarkom). It passed the Decree on Peace and the Decree on Land, which gave landowners’ land to the peasants.","Delivered on ‘Peace, Land and Bread’ and won popular support."],
[1917,"Nov – Dec 1917",4,"The 1917 Decrees","Decrees banned opposition newspapers, gave workers control of factories, set an 8-hour working day, nationalised the banks and promised rights to the national minorities.","Won support from workers and peasants while giving the Bolsheviks more control."],
[1917,"12 Nov 1917",4,"Constituent Assembly elections","Russia’s first free national election. The SRs won 53% of the vote; the Bolsheviks got just under a quarter, though nearly half in Petrograd and Moscow.","Showed that the Bolsheviks did not have majority support across the country."],
[1917,"Dec 1917",4,"The Cheka is set up","A secret police force led by Felix Dzerzhinsky, set up to fight ‘counter-revolution’.","Terror became a key tool for keeping the Bolsheviks in power."],
[1918,"5 – 6 Jan 1918",4,"Constituent Assembly closed","The Assembly met once. The next day Red Guards stopped it meeting again.","Ended hopes of democracy in Russia and began one-party rule."],
[1918,"Feb 1918",4,"Russia switches calendar","Russia adopted the Western calendar: 31 January was followed by 14 February.","From now on, Russian dates match Western dates."],
[1918,"3 Mar 1918",4,"Treaty of Brest-Litovsk","Peace with Germany. Russia gave up the Baltic provinces, Finland, parts of Poland, Ukraine and Georgia: 74% of its coal mines and iron ore, 50% of its industry, 27% of its farmland and 26% of its population (62 million people). It also had to pay 300 million gold roubles.","Lenin kept his promise of peace, but the harsh terms outraged opponents, including the Left SRs. A cause of the Civil War."],
[1918,"13 Mar 1918",4,"Trotsky becomes War Commissar","Trotsky built the Red Army, using ex-tsarist officers supervised by political commissars and very harsh discipline. Conscription began in May 1918, and by 1921 the Red Army had 5.4 million men.","Trotsky’s leadership is a key reason for Bolshevik victory in the Civil War. (In March 1918 the capital also moved to Moscow.)"],
[1918,"May 1918",4,"Czech Legion revolt: Civil War spreads","About 50,000 Czech soldiers refused Trotsky’s order to give up their weapons, seized large stretches of the Trans-Siberian Railway and joined forces with the SRs.","The sides: the Reds against the Whites (and the Greens, peasant armies such as Makhno’s). Foreign powers helped the Whites: Britain sent supplies worth £100 million, and Japan sent 70,000 troops to Siberia."],
[1918,"Jun 1918",5,"War Communism introduced","The state took control of the economy. Factories with more than 10 workers were nationalised, strikes were banned, everyone had to work, grain was requisitioned from peasants by force and private trade was banned. It lasted until March 1921.","Kept the Red Army supplied and helped win the Civil War, but caused famine, falling production and hatred among peasants and workers."],
[1918,"17 Jul 1918",4,"The Tsar and his family executed","Nicholas, Alexandra, their five children and four servants were shot in Yekaterinburg as White forces and the Czech Legion approached.","The Whites lost a possible figurehead."],
[1918,"Aug – Sep 1918",4,"The Red Terror","After Fanya Kaplan, an SR, shot Lenin three times on 30 August, the Cheka launched the Red Terror, arresting suspected opponents and executing them without trial. An estimated 300,000 people were killed by the Cheka between 1918 and 1920.","Terror crushed opposition behind Red lines during the war."],
[1918,"18 Nov 1918",4,"Kolchak’s offensive in the east","Admiral Kolchak’s White army in Siberia was very successful at first: by June 1919 it was within 800 km of Moscow. Then it split over disagreements and the Red Army forced it back.","The main White leaders: Kolchak (Siberia), Yudenich (north-west), Denikin and later Wrangel (south)."],
[1919,"Oct 1919",4,"Yudenich and Denikin advance","Yudenich’s Whites nearly reached Petrograd, but desperate fighting drove them back to Estonia. Denikin’s army in the south got within about 520 km of Moscow before being pushed back.","Reasons for Red victory: they held the central area with its railways, factories and population; they had one command (Trotsky’s armoured train); the Whites were divided, far apart and unpopular with peasants."],
[1920,"Feb 1920",4,"Kolchak executed","Kolchak was handed over to the Bolsheviks and shot in Irkutsk.","The White threat in the east was over."],
[1920,"Apr 1920 – Mar 1921",4,"War with Poland","Poland invaded Ukraine. The Red Army pushed back to Warsaw but was defeated there. The Treaty of Riga (1921) ended the war.","Showed the limits of spreading revolution by force."],
[1920,"7 – 15 Nov 1920",4,"Battle of Perekop","The Red Army defeated General Wrangel’s White army in the Crimea in the final battle of the Civil War.","The Bolsheviks had won the Civil War. Reasons: Trotsky’s Red Army, control of central Russia, War Communism, the Red Terror and divided Whites."],
[1921,"1920 – 1921",5,"Famine","Crop failures, the Civil War and grain requisitioning caused famines. In the Volga region alone, 20 million people were affected and an estimated 5 million died from starvation and disease.","One of the effects of War Communism."],
[1921,"Feb – Mar 1921",5,"Kronstadt Naval Mutiny","On 28 February sailors on the battleship Petropavlovsk at Kronstadt, the ‘reddest of the red’, mutinied, demanding free elections to the soviets, free speech and an end to requisitioning. The Red Army attacked across the frozen sea and retook the base by 17 March. Around 8,000 sailors escaped to Finland and about 500 were executed.","Lenin called it ‘the flash that lit up reality’. It persuaded him that War Communism had to end."],
[1921,"Mar 1921",5,"NEP announced at the 10th Party Congress","Requisitioning ended. Peasants gave a fixed amount to the state (a tax in kind) and could sell the rest on a free market, paying a 10% tax on what they sold. Small businesses could trade for profit; the state kept the ‘commanding heights’ such as heavy industry and banks. Lenin called it a ‘peasant Brest-Litovsk’.","Production recovered, but many Bolsheviks saw it as a betrayal of communism and resented the new ‘Nepmen’ traders."],
[1922,"Apr 1922",5,"Stalin becomes General Secretary","Stalin was put in charge of the party’s organisation and appointments.","Seen as a dull job, it gave him enormous power over party membership."],
[1922,"May 1922",5,"Lenin’s first stroke","Lenin had his first stroke. A second, in December 1922, made him retire from politics, and a third, in March 1923, left him unable to speak.","He was increasingly unable to rule, and his colleagues began competing to succeed him."],
[1922,"30 Dec 1922",5,"The USSR is created","Russia, Ukraine, Belorussia and the Transcaucasian republic formed the Union of Soviet Socialist Republics.","One of Lenin’s achievements: a new state run by a single party."],
[1923,"Dec 1922 – Jan 1923",5,"Lenin’s Testament","Lenin criticised all the leading Bolsheviks. In a postscript he called Stalin ‘too rude’ and said he should be removed as General Secretary.","If published, it could have ended Stalin’s career (see 1924)."],
[1923,"1923",5,"The ‘Scissors Crisis’","Prices of factory goods rose while food prices fell, so peasants held back grain. Trotsky named it after the graph of the two prices, which looked like open scissors.","Part of the opposition to NEP within the party."],
[1924,"21 Jan 1924",5,"Lenin dies","Lenin died aged 53, after a series of strokes. In the first 6 weeks, 100,000 people visited his embalmed body.","His achievements: led the Bolshevik takeover, won the Civil War, created a one-party state and the USSR, and brought in NEP to save the economy."],
[1920,"Aug 1920",4,"Tambov uprisings","Peasants in the Tambov region rose up against grain requisitioning that left families with nothing. The Red Army crushed them, even using poison gas.","Showed how much peasants hated War Communism."]

}

/* ---------- lesson building ---------- */
function buildLesson(){
  const P=pool(),today=dayStr(),c=S.cards;
  // Reviews come first: every event that's due, the longest-waiting first (and, among equals, the closest to learned)
  const due=shuffle(P.filter(e=>c[e.id]&&c[e.id].due<=today)).sort((a,b)=>c[a.id].due<c[b.id].due?-1:c[a.id].due>c[b.id].due?1:c[b.id].box-c[a.id].box);
  let fresh=P.filter(e=>!c[e.id]);
  if(S.unit==="both"){const fa=fresh.filter(e=>e.u==="a"),fb=fresh.filter(e=>e.u==="b");fresh=[];while(fa.length||fb.length){if(fa.length)fresh.push(fa.shift());if(fb.length)fresh.push(fb.shift())}}
  // New events only take the places left over
  let picks=due.slice(0,LEN);
  picks=picks.concat(fresh.slice(0,Math.min(MAX_NEW,LEN-picks.length)));
  if(picks.length<LEN){const rest=shuffle(P.filter(e=>!picks.includes(e)&&c[e.id])).sort((a,b)=>c[a.id].box-c[b.id].box);picks=picks.concat(rest.slice(0,LEN-picks.length))}
  if(picks.length<LEN)picks=picks.concat(fresh.filter(e=>!picks.includes(e)).slice(0,LEN-picks.length));
  return shuffle(picks).map(e=>makeQ(e));
}
function makeQ(e,forceType){
  const box=(S.cards[e.id]||{box:0}).box;
  let t=forceType;
  if(!t){
    const opts=box===0?["what","what","when"]:box===1?["what","when","why"]:["when","why","order","why"];
    t=rnd(opts);
  }
  if((t==="when"||t==="order")&&!e.single)t=rnd(["what","why"]);
  const same=ALL.filter(x=>x.u===e.u&&x!==e);
  if(t==="order"){
    const cand=shuffle(same.filter(x=>x.single&&Math.abs(x.fy-e.fy)>=1));
    const picked=[e];for(const x of cand){if(picked.every(p=>p.fy!==x.fy))picked.push(x);if(picked.length===3)break}
    if(picked.length<3)return makeQ(e,"what");
    return{t,e,items:shuffle(picked)};
  }
  if(t==="when"){
    const lo=e.u==="a"?1900:1917,hi=e.u==="a"?1924:1955,ys=new Set([e.fy]);
    const near=shuffle([-4,-3,-2,-1,1,2,3,4].map(n=>e.fy+n).filter(y=>y>=lo&&y<=hi));
    for(const y of near){if(ys.size>=4)break;ys.add(y)}
    return{t,e,options:shuffle([...ys]).map(y=>({label:String(y),ok:y===e.fy}))};
  }
  const dis=shuffle(same.filter(x=>x.h!==e.h)).slice(0,3);
  return{t,e,options:shuffle([e,...dis]).map(x=>({label:x.h,ok:x===e}))};
}

/* ---------- lesson flow ---------- */
let L=null;
function startLesson(){L={queue:buildLesson(),done:0,total:LEN,first:new Set(),correctFirst:0,xp:0,combo:0,start:Date.now()};L.total=L.queue.length;nextQ()}
function nextQ(){
  if(!L.queue.length)return finish();
  L.q=L.queue[0];L.sel=null;L.order=[];renderQ();
}
function header(){return `<div class="lhead"><button class="iconbtn" id="quit" aria-label="Quit lesson">${CLOSE}</button><div class="lbar" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.done}"><i style="width:${Math.max(4,L.done/L.total*100)}%"></i></div></div>`}
function renderQ(){
  const q=L.q,e=q.e;let body="";
  if(q.t==="what")body=`<div class="qtype">Which event?</div><div class="qtitle">Which event does this describe?</div><div class="clue"><span class="tag">${UNIT_NAME[e.u]}</span><span class="when">${esc(e.d)}</span>${esc(e.w)}</div>`;
  if(q.t==="why")body=`<div class="qtype">Why it matters</div><div class="qtitle">Which event is this about?</div><div class="clue"><span class="tag">Why it mattered</span><span class="when">${esc(e.d)}</span>${esc(e.s)}</div>`;
  if(q.t==="when")body=`<div class="qtype">When?</div><div class="qtitle">In which year did this happen?</div><div class="clue"><span class="tag">${UNIT_NAME[e.u]}</span><strong>${esc(e.h)}</strong></div>`;
  if(q.t==="order")body=`<div class="qtype">Timeline</div><div class="qtitle">Put these in order, earliest first</div>
    <div class="slots">${[0,1,2].map(i=>`<div class="slot" data-i="${i}"><b>${i+1}</b><span>Tap an event below</span></div>`).join("")}</div>`;
  const opts=q.t==="order"
    ? `<div class="opts" id="opts">${q.items.map((x,i)=>`<button class="opt" data-k="${i}">${esc(x.h)}</button>`).join("")}</div>`
    : `<div class="opts${q.t==="when"?" years":""}" id="opts">${q.options.map((o,i)=>`<button class="opt" data-k="${i}" aria-pressed="false">${esc(o.label)}</button>`).join("")}</div>`;
  app.innerHTML=header()+body+opts+`<div class="spacer"></div><div class="foot"><button class="btn green" id="check" disabled>Check</button></div>`;
  $("#quit").onclick=()=>{L=null;home()};
  const check=$("#check");
  if(q.t==="order"){
    const paint=()=>{
      app.querySelectorAll(".slot").forEach((s,i)=>{const k=L.order[i];s.classList.toggle("filled",k!=null);s.querySelector("span").textContent=k!=null?q.items[k].h:"Tap an event below"});
      app.querySelectorAll("#opts .opt").forEach(b=>b.hidden=L.order.includes(+b.dataset.k));
      check.disabled=L.order.length<3;
    };
    app.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{SND.tap();if(L.order.length<3)L.order.push(+b.dataset.k);paint()});
    app.querySelectorAll(".slot").forEach(s=>s.onclick=()=>{const i=+s.dataset.i;if(L.order[i]!=null&&!L.answered){L.order.splice(i,1);paint()}});
    paint();
  }else{
    app.querySelectorAll("#opts .opt").forEach(b=>b.onclick=()=>{SND.tap();L.sel=+b.dataset.k;app.querySelectorAll("#opts .opt").forEach(x=>x.setAttribute("aria-pressed",x===b));check.disabled=false});
  }
  L.answered=false;
  check.onclick=grade;
  window.scrollTo(0,0);
}
function grade(){
  const q=L.q;L.answered=true;let ok;
  if(q.t==="order"){
    const right=q.items.map((x,i)=>i).sort((a,b)=>q.items[a].key-q.items[b].key);
    ok=right.every((k,i)=>L.order[i]===k);
    app.querySelectorAll(".slot").forEach((s,i)=>{s.classList.add(L.order[i]===right[i]?"right":"wrong");s.onclick=null});
    L.correctOrder=right;
  }else{
    ok=q.options[L.sel].ok;
    app.querySelectorAll("#opts .opt").forEach((b,i)=>{b.disabled=true;if(q.options[i].ok)b.classList.add("right");else if(i===L.sel)b.classList.add("wrong")});
  }
  const firstTry=!L.first.has(q.e.id);L.first.add(q.e.id);
  const c=S.cards[q.e.id]||{box:0,due:dayStr()};
  if(firstTry){
    if(ok){if(c.lc!==dayStr()){c.box=Math.min(c.box+1,5);c.due=addDays(dayStr(),INTERVALS[c.box]);c.lc=dayStr()}L.correctFirst++;L.xp+=10}
    else{c.box=Math.max(0,c.box-1);c.due=dayStr()}
    S.cards[q.e.id]=c;save();
  }else if(ok)L.xp+=2;
  L.queue.shift();
  if(ok)L.done++;else L.queue.push(makeQ(q.e,q.t==="order"?"when":rnd(["what","why"])));
  ok?SND.right():SND.wrong();
  L.combo=ok&&firstTry?L.combo+1:0;
  // Fireworks for every right answer; a bigger show for answers in a row
  if(ok)fireworks(L.combo>=3?Math.min(L.combo,5):1,L.combo>=3);
  const e=q.e;
  let fact="",viz;
  if(q.t==="order")viz=ruler(L.correctOrder.map(k=>q.items[k]),ok);
  else{
    fact=`${ok?"":`<strong>Correct answer${q.t==="when"?": "+e.fy:""}</strong><br>`}<span class="d">${esc(e.d)}</span> · <strong>${esc(e.h)}</strong><br>${esc(e.s)}`;
    viz=strip(e,(q.t==="when"&&!ok)?+q.options[L.sel].label:null);
  }
  const praise=L.combo>=3?`${L.combo} in a row!`:rnd(["Correct!","Nice one!","Spot on!","Brilliant!","Exactly right!"]);
  const sheet=document.createElement("div");
  sheet.className="sheet "+(ok?"ok":"no");sheet.setAttribute("role","status");
  sheet.innerHTML=`<div class="in"><div class="hd">${mascot(ok?"right":"wrong")}<span>${ok?praise:"Not quite"}</span></div>${fact?`<div class="fact">${fact}</div>`:""}${viz}<div class="btns"><button class="btn tl ${ok?"g":"o"}" id="tl">${TL_ICON}Timeline</button><button class="btn ${ok?"green":"orange"}" id="cont">Continue</button></div></div>`;
  app.querySelector(".foot").style.visibility="hidden";
  document.body.appendChild(sheet);
  const pad=sheet.offsetHeight;app.style.paddingBottom=pad+"px";
  $("#cont").focus();
  $("#cont").onclick=()=>{sheet.remove();app.style.paddingBottom="";
    $(".lbar i")&&($(".lbar i").style.width=Math.max(4,L.done/L.total*100)+"%");
    nextQ()};
  $("#tl").onclick=()=>openTimeline(e.u,e.id,true);
}
function finish(){
  const today=dayStr(),was=S.last;
  let streakUp=false;
  if(was!==today){S.streak=(was&&gap(was,today)===1)?S.streak+1:1;streakUp=true;S.days.push(today);S.days=S.days.slice(-120)}
  S.last=today;S.best=Math.max(S.best,S.streak);
  const bonus=10;S.xp+=L.xp+bonus;S.lessons++;save();syncNative();
  const acc=Math.round(L.correctFirst/L.total*100),secs=Math.round((Date.now()-L.start)/1000);
  const msg=acc===100?"Perfect lesson!":acc>=75?"Lesson complete!":"Lesson done. Practice makes perfect!";
  app.innerHTML=`<div class="done-wrap">${mascot("celebrate")}<h1>${msg}</h1>
   ${streakUp?`<div class="stat" style="font-size:22px">${FLAME}${S.streak} day streak!</div>`:`<div class="sub">You’ve already kept your streak today. Extra practice still counts!</div>`}
   <div class="tiles">
    <div class="tile" style="--c:var(--gold)"><div class="t">XP</div><div class="v">+${L.xp+bonus}</div></div>
    <div class="tile" style="--c:var(--green)"><div class="t">Accuracy</div><div class="v">${acc}%</div></div>
    <div class="tile" style="--c:var(--blue)"><div class="t">Time</div><div class="v">${Math.floor(secs/60)}:${z(secs%60)}</div></div>
   </div></div>
   <div class="foot"><button class="btn" id="home">Continue</button></div>`;
  SND.done();confetti();fireworks(acc===100?7:3,acc===100);
  $("#home").onclick=home;L=null;
}

const TL_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 4v16M5 7h10M5 12h14M5 17h8"/></svg>`;
const BACK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;
const yrsLabel=(a,b)=>a===b?String(a):`${a}–${String(a).slice(0,2)===String(b).slice(0,2)?String(b).slice(2):b}`;
// A short strip of the timeline around one event (2 before, 2 after), plus the player's wrong year if given
function strip(e,guess){
  const U=ALL.filter(x=>x.u===e.u).slice().sort((a,b)=>a.key-b.key);
  const i=U.indexOf(e),start=Math.max(0,Math.min(i-2,U.length-5)),W=U.slice(start,start+5);
  const ys=W.map(x=>x.fy).concat(guess!=null?[guess]:[]);
  const lo=Math.min(...ys),hi=Math.max(...ys),sameYear=lo===hi&&W.every(x=>x.single);
  const lbl=x=>{const t=sameYear?x.d.replace(/\s*\d{4}$/,""):x.d;return t||x.d};
  const rows=W.map(x=>({k:x.key,h:`<div class="srow${x===e?" cur":""}"><span class="sd">${esc(lbl(x))}</span><span class="sdot"></span><span class="st">${esc(x.h)}</span></div>`}));
  if(guess!=null){
    const diff=guess-e.fy,n=Math.abs(diff);
    const m={k:guess*100,h:`<div class="srow guess"><span class="sd">${guess}</span><span class="sdot"></span><span class="st">You said ${guess}: ${n} year${n>1?"s":""} too ${diff<0?"early":"late"}</span></div>`};
    const at=rows.findIndex(r=>r.k>=m.k);if(at<0)rows.push(m);else rows.splice(at,0,m);
  }

}
// The three events of an order question on a year ruler, with the gaps between them
function ruler(items,ok){
  const fr=x=>x.fy+(((x.key%100)||6)-0.5)/12, f=items.map(fr);
  // Events less than 18 months apart are drawn on a month scale, otherwise a year scale
  let a=Math.floor(f[0]),b=Math.ceil(f[2]),step=1,hy=[a,b];
  if(f[2]-f[0]<1.5){a=Math.floor(f[0]*12-1)/12;b=Math.ceil(f[2]*12+1)/12;step=1/12;hy=[items[0].fy,items[2].fy]}
  else{if(b-a<2)b=a+2;if(b-a>15)step=5;hy=[a,b]}
  const P=v=>5+(v-a)/(b-a)*90;
  let h='<div class="rline"></div>';
  for(let y=a;y<=b+1e-9;y+=step)h+=`<i class="rtick" style="left:${P(y)}%"></i>`;
  const mo=x=>x.fy*12+(((x.key%100)||6)-1);
  [0,1].forEach(j=>{const dm=mo(items[j+1])-mo(items[j]),d=items[j+1].fy-items[j].fy,p1=P(f[j]),p2=P(f[j+1]);
    const txt=dm<12?(dm<=0?"same month":dm+" month"+(dm>1?"s":"")):d+" year"+(d>1?"s":"");
    if(p2-p1>=30)h+=`<span class="rgap" style="left:${(p1+p2)/2}%">${txt}</span>`});
  const lab=x=>`<b>${esc(x.d)}</b>${esc(x.h)}`, pm=P(f[1]);
  const midPos=pm<30?"left:0":pm>70?"right:0;text-align:right":`left:${pm}%;transform:translateX(-50%);text-align:center`;
  h+=`<div class="rlab up" style="left:0">${lab(items[0])}</div><i class="rstem up" style="left:${P(f[0])}%"></i>`;
  h+=`<div class="rlab up" style="right:0;text-align:right">${lab(items[2])}</div><i class="rstem up" style="left:${P(f[2])}%"></i>`;
  h+=`<div class="rlab dn" style="${midPos}">${lab(items[1])}</div><i class="rstem dn" style="left:${pm}%"></i>`;
  f.forEach(v=>h+=`<i class="rdot" style="left:${P(v)}%"></i>`);
  return `<div class="strip"><div class="shead"><span>${ok?"How far apart":"The right order"} · ${yrsLabel(hy[0],hy[1])}</span></div><div class="ruler">${h}</div></div>`;
}

/* ---------- timeline challenge ---------- */
let CH=null,chOpen=false;
const chWeak=e=>{const c=S.cards[e.id];return c?c.box:0.5};
// Events of a unit whose order is unambiguous: in date order, a month known (or the only event that year), no ties
function chDeck(u){
  const U=ALL.filter(e=>e.u===u).slice().sort((a,b)=>a.key-b.key),per={};
  U.forEach(e=>per[e.fy]=(per[e.fy]||0)+1);
  const span=e=>{const m=e.d.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g)||[],y=e.d.match(/\d{4}/g)||[];return m.length>1||new Set(y).size>1||/\d{4}\s*–\s*\d{2}(?!\d)/.test(e.d)};
  const clear=e=>!/Winter/.test(e.d)&&!span(e)&&(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/.test(e.d)||per[e.fy]===1);
  const D=[];U.filter(clear).forEach(e=>{if(!D.length||D[D.length-1].key<e.key)D.push(e)});
  return D;
}
// Three puzzles, each a window of 7 neighbouring events: 2-3 to place (weakest first, never side by side), the rest as anchors
function chPuzzles(u){
  const D=chDeck(u),W=7,used=new Set(),out=[];
  if(D.length<W)return out;
  const order=shuffle(D.map((e,i)=>i)).sort((a,b)=>chWeak(D[a])-chWeak(D[b]));
  for(const i of order){
    if(out.length===3)break;
    const st=Math.max(0,Math.min(i-3,D.length-W)),idx=[...Array(W).keys()].map(k=>st+k);
    if(idx.some(k=>used.has(k)))continue;
    const win=idx.map(k=>D[k]),pick=[i-st];
    for(const k of shuffle(win.map((e,k)=>k)).sort((a,b)=>chWeak(win[a])-chWeak(win[b]))){
      if(pick.length===3)break;
      if(!pick.includes(k)&&pick.every(p=>Math.abs(p-k)>1))pick.push(k);
    }
    if(pick.length<2)continue;
    idx.forEach(k=>used.add(k));
    const cards=pick.map(k=>win[k]),anchors=win.filter((e,k)=>!pick.includes(k)),answer={};
    cards.forEach(c=>answer[c.id]=anchors.filter(a=>a.key<c.key).length);
    out.push({anchors,cards:shuffle(cards),answer,place:{},checked:false});
  }
  return out;
}
// One placed card = one answer for that event (moves up at most once a day; a wrong answer moves it back a step)
function chRecord(e,ok){
  const t=dayStr(),c=S.cards[e.id]||{box:0,due:t};
  if(ok){if(c.lc!==t){c.box=Math.min(c.box+1,5);c.due=addDays(t,INTERVALS[c.box]);c.lc=t}}
  else{c.box=Math.max(0,c.box-1);c.due=t}
  S.cards[e.id]=c;
}
function openChallenge(u){
  CH={u,puzzles:chPuzzles(u),i:0,sel:null,xp:0,right:0,total:0,done:false};
  let o=$(".cho");
  if(!o){o=document.createElement("div");o.className="cho";o.setAttribute("role","dialog");o.setAttribute("aria-label","Timeline challenge");document.body.appendChild(o)}
  if(!chOpen){try{history.pushState({nadyaCh:1},"")}catch(err){}}
  chOpen=true;renderCh();o.scrollTop=0;
}
function closeChallenge(){
  const o=$(".cho");if(o)o.remove();
  const u=CH?CH.u:"a";chOpen=false;CH=null;
  if(app.querySelector(".week"))home();
  if(tlOpen)openTimeline(u,null,false);
}
function chQuit(){if(history.state&&history.state.nadyaCh){try{history.back();return}catch(err){}}closeChallenge()}
function chPlace(id,g){
  const P=CH.puzzles[CH.i],from=P.place[id];
  if(g==="tray"){delete P.place[id]}
  else{
    const other=P.cards.find(c=>c.id!==id&&P.place[c.id]===g);
    if(other){if(from!=null)P.place[other.id]=from;else delete P.place[other.id]}
    P.place[id]=g;
  }
  CH.sel=null;SND.tap();renderCh();
}
function chTap(id){
  const P=CH.puzzles[CH.i];
  if(CH.sel&&CH.sel!==id&&P.place[id]!=null){chPlace(CH.sel,P.place[id]);return}
  CH.sel=CH.sel===id?null:id;SND.tap();renderCh();
}
function chCheck(){
  const P=CH.puzzles[CH.i];let n=0;P.res={};
  P.cards.forEach(c=>{const ok=P.place[c.id]===P.answer[c.id];P.res[c.id]=ok;chRecord(c,ok);if(ok){n++;CH.xp+=10;S.xp+=10}});
  P.checked=true;P.n=n;CH.right+=n;CH.total+=P.cards.length;save();
  n===P.cards.length?SND.right():SND.wrong();if(n===P.cards.length)fireworks(3,true);else if(n)fireworks(1);renderCh();
}
function renderCh(){
  const o=$(".cho");if(!o||!CH)return;
  const head=(frac,txt)=>`<div class="chhead"><button class="iconbtn" id="chclose" aria-label="Close the challenge">${CLOSE}</button><div class="lbar"><i style="width:${Math.max(4,frac*100)}%"></i></div><span class="meta">${txt}</span></div>`;
  if(!CH.puzzles.length){
    o.innerHTML=`<div class="wrapper">${head(0,"")}<div class="done-wrap">${mascot("waiting")}<h1 style="color:var(--ink)">Not enough events here yet</h1></div></div>`;

  }
  if(CH.done){
    const perfect=CH.right===CH.total;
    o.innerHTML=`<div class="wrapper">${head(1,"")}<div class="done-wrap">${mascot(perfect?"celebrate":"happy")}<h1>${perfect?"Perfect timeline!":"Challenge complete!"}</h1>

      <div class="tiles" style="grid-template-columns:repeat(2,1fr)"><div class="tile" style="--c:var(--gold)"><div class="t">XP</div><div class="v">+${CH.xp}</div></div><div class="tile" style="--c:var(--green)"><div class="t">Correct</div><div class="v">${CH.right}/${CH.total}</div></div></div></div>
      <div class="foot" style="display:grid;gap:12px"><button class="btn" id="chagain">Play again</button><button class="btn ghost" id="chback">Back to the timeline</button></div></div>`;
    $("#chclose").onclick=chQuit;$("#chback").onclick=chQuit;$("#chagain").onclick=()=>{openChallenge(CH.u)};

  }
  const P=CH.puzzles[CH.i],A=P.anchors.length,N=CH.puzzles.length;
  const occ=g=>P.cards.filter(c=>(P.checked?P.answer[c.id]:P.place[c.id])===g);
  const card=c=>{let cls="chcard";if(P.checked)cls+=P.res[c.id]?" right":" wrong";else if(CH.sel===c.id)cls+=" sel";
    return `<button class="${cls}" data-card="${c.id}"${P.checked?" disabled":""}>${P.checked?`<span class="cd">${esc(c.d)}</span>`:""}${esc(c.h)}${P.checked&&!P.res[c.id]?'<span class="tag">It belongs here</span>':""}</button>`};
  const where=g=>g===0?`before ${P.anchors[0].h}`:g===A?`after ${P.anchors[A-1].h}`:`between ${P.anchors[g-1].h} and ${P.anchors[g].h}`;
  let strip="";
  for(let g=0;g<=A;g++){
    const here=occ(g);
    if(here.length)strip+=`<div class="chgap filled" data-gap="${g}">${here.map(card).join("")}</div>`;
    else if(P.checked)strip+=`<div class="chgap quiet"></div>`;
    else strip+=`<div class="chgap${CH.sel?" armed":""}" data-gap="${g}"><button class="slot" data-slot="${g}" aria-label="Place here, ${esc(where(g))}">${CH.sel?"Tap to place here":"Drop here"}</button></div>`;
    if(g<A){const a=P.anchors[g];strip+=`<div class="chanchor"><span class="d">${esc(a.d)}</span><span class="h">${esc(a.h)}</span></div>`}
  }
  const tray=P.cards.filter(c=>P.place[c.id]==null);
  let tail="";
  if(P.checked){
    const cs=P.cards.slice().sort((a,b)=>a.key-b.key);
    let items=cs;
    if(cs.length===2){const mid=P.anchors.find(a=>a.key>cs[0].key&&a.key<cs[1].key);items=mid?[cs[0],mid,cs[1]]:null}
    if(items&&items.length===3)tail=ruler(items,true);
  }else{
    tail=`<div class="chtray" data-gap="tray"><span class="lbl">${tray.length?"Place these events":"All placed. Tap Check, or move any of them"}</span>${tray.map(card).join("")}</div>`;
  }
  const title=P.checked?`<div class="chres ${P.n===P.cards.length?"ok":"no"}">${P.n===P.cards.length?rnd(["Spot on!","Perfect!","Nailed it!"]):`${P.n} of ${P.cards.length} right`}</div>`
    :`<div class="qtype">Timeline challenge</div><div class="qtitle">Where do these events fit?</div><div class="legend">Drag each event into the right gap, or tap it and then tap a gap.</div>`;
  o.innerHTML=`<div class="wrapper">${head((CH.i+(P.checked?1:0))/N,`${CH.i+1} of ${N}`)}${title}${P.checked?"":tail}<div class="chstrip">${strip}</div>${P.checked?tail:""}<div class="spacer"></div>
    <div class="foot">${P.checked?`<button class="btn ${P.n===P.cards.length?"green":"orange"}" id="chnext">${CH.i+1<N?"Next puzzle":"See results"}</button>`:`<button class="btn green" id="chcheck"${tray.length?" disabled":""}>Check</button>`}</div></div>`;
  $("#chclose").onclick=chQuit;

      o.querySelectorAll(".over").forEach(x=>{if(x!==z)x.classList.remove("over")});if(z)z.classList.add("over");drag.zone=z;

  });
}

/* ---------- fireworks ---------- */
let FW=null;
const FW_COLS=["#F4B740","#FF8A1E","#D9383A","#5B83F0","#4CC173","#FFFFFF","#B49AE0"];
// Launch n rockets that burst into sparks; big = larger bursts with a second colour
function fireworks(n=1,big=false){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  if(!FW){const cv=document.createElement("canvas");cv.setAttribute("aria-hidden","true");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70";document.body.appendChild(cv);FW={cv,ctx:cv.getContext("2d"),rockets:[],sparks:[],pending:0,run:false}}
  const d=devicePixelRatio||1,W=FW.cv.width=innerWidth*d,H=FW.cv.height=innerHeight*d;
  for(let i=0;i<n;i++){
    FW.pending++;
    setTimeout(()=>{FW.pending--;
      FW.rockets.push({x:W*(0.15+Math.random()*0.7),y:H*0.98,vx:(Math.random()-.5)*W*0.002,vy:-H*(0.017+Math.random()*0.005),ty:H*(0.07+Math.random()*0.2),c:rnd(FW_COLS),c2:rnd(FW_COLS),big,d});
      SND.whoosh();
    },i*(big?260:180)+Math.random()*80);
  }
  if(!FW.run){FW.run=true;requestAnimationFrame(fwStep)}
}
function fwBurst(r){
  const n=r.big?110:70,sp=r.d*(r.big?7.5:6);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(0.35+Math.random()*0.65);
    FW.sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.011+Math.random()*0.012,c:r.big&&i%2?r.c2:r.c,s:r.d*(1.4+Math.random()*1.4)})}
  SND.pop();
}
function fwStep(){
  const {cv,ctx}=FW,g=FW.cv.height*0.00012;
  ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,0.28)";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalCompositeOperation="lighter";
  FW.rockets=FW.rockets.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=g*0.6;
    ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.2*r.d,0,7);ctx.fill();
    if(r.y<=r.ty||r.vy>=0){fwBurst(r);return false}return true});
  FW.sparks=FW.sparks.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=g;p.vx*=0.985;p.vy*=0.985;p.life-=p.decay;
    if(p.life<=0)return false;ctx.globalAlpha=Math.min(1,p.life*1.4)*(Math.random()<0.08?0.4:1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();ctx.globalAlpha=1;return true});
  if(FW.rockets.length||FW.sparks.length||FW.pending)requestAnimationFrame(fwStep);
  else{ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,cv.width,cv.height);FW.run=false}
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx"),ctx=cv.getContext("2d");cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=["#D9383A","#F4B740","#2D5BD7","#36A256","#FF8A1E"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.02,vy:-Math.random()*H*.025-H*.005,r:(4+Math.random()*5)*devicePixelRatio,c:rnd(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*.0009;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
   if(t-t0<2800)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);cv.hidden=true}})(t0);
}

/* ---------- boot ---------- */
let installEvt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(!L&&app.querySelector(".week"))home()});
window.addEventListener("appinstalled",()=>{installEvt=null;if(!L&&app.querySelector(".week"))home()});
// When the app comes back on screen, pick up a newer version if one has been published (not mid-lesson)
function checkForUpdate(){
  if(NATIVE||!/^https:/.test(location.protocol)||/claude\.ai|claudeusercontent/.test(location.host))return;
  fetch("./index.html?check="+Date.now(),{cache:"no-store"}).then(r=>r.ok?r.text():"").then(t=>{
    const m=t.match(/const APP_VERSION="([^"]+)"/);
    if(m&&m[1]!==APP_VERSION&&!L&&!tlOpen)location.reload();
  }).catch(()=>{});
}
document.addEventListener("visibilitychange",()=>{if(document.hidden)return;if(!L&&app.querySelector(".week"))home();checkForUpdate()});
home();
if(!NATIVE&&"serviceWorker" in navigator&&location.protocol==="https:"&&!/claude\.ai|claudeusercontent/.test(location.host)){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}
</script>
