EV.c=[
[1918,"Nov 1918",1,"Kiel mutiny and the German Revolution","Sailors at Kiel refused orders to sail out and fight the British. The revolt spread fast: workers’ and soldiers’ councils took over towns across Germany.","The start of the German Revolution. It showed the Kaiser had lost control, and pushed him to give up power."],
[1918,"9 Nov 1918",1,"The Kaiser abdicates","Kaiser Wilhelm II gave up the throne and fled to the Netherlands. Germany was declared a republic, and Friedrich Ebert, leader of the Social Democrats (SPD), took charge.","The end of the monarchy. The new republic was born in defeat and chaos, which made it look weak from the start."],
[1918,"11 Nov 1918",1,"The armistice is signed","Ebert’s new government agreed a ceasefire with the Allies, ending the fighting of the First World War.","Many Germans believed the army had not really been beaten. They blamed the politicians who signed: the ‘November Criminals’ who had ‘stabbed Germany in the back’."],
[1919,"Jan 1919",1,"The Spartacist uprising","Communists of the Spartacist League, led by Rosa Luxemburg and Karl Liebknecht, tried to seize power in Berlin. The government used the army and the Freikorps (ex-soldiers) to crush them, and both leaders were killed.","A threat from the Left. Relying on the right-wing Freikorps showed how weak the government was without the army."],
[1919,"Feb 1919",1,"National Assembly meets at Weimar","The newly elected National Assembly met in the small town of Weimar because Berlin was too dangerous. It chose Ebert as the first president.","The republic took its name from the town. It had to begin life away from the capital: a sign of how unstable Germany was."],
[1919,"28 Jun 1919",1,"The Treaty of Versailles signed","Germany lost about 13% of its land and all its colonies. Its army was cut to 100,000 men, with no air force or submarines, and the Rhineland was demilitarised. Germany had to accept blame for the war (the ‘war guilt’ clause) and pay reparations.","Germans called it a ‘diktat’: a dictated peace. The hatred it caused was turned on the Weimar politicians who signed it, and later used by Hitler."],
[1919,"Aug 1919",1,"The Weimar Constitution","Germany became a democracy. Men and women over 20 could vote, the Reichstag was elected by proportional representation, and an elected president served for seven years. Article 48 let the president rule by decree in an emergency.","Its strengths: rights for all and a fair voting system. Its weaknesses: proportional representation led to many small parties and weak coalitions, and Article 48 could be used to bypass the Reichstag."],
[1919,"Sep 1919",3,"Hitler joins the German Workers’ Party","Sent by the army to spy on the small German Workers’ Party (DAP), led by Anton Drexler, Hitler joined it instead. He soon became its star speaker.","The beginning of Hitler’s political career."],
[1920,"Feb 1920",3,"The Twenty-Five Point Programme","The party set out its aims: tearing up the Treaty of Versailles, uniting all Germans, taking land for Germany to expand, and excluding Jews from citizenship. It renamed itself the National Socialist German Workers’ Party (NSDAP), the Nazis.","Its policies appealed to nationalists, workers and the lower middle class. Many of its ideas became Nazi policy after 1933."],
[1920,"Mar 1920",1,"The Kapp Putsch","Freikorps units led by Wolfgang Kapp marched into Berlin to take power for the Right. The army refused to fire on them, and the government fled. Workers in Berlin called a general strike, and the putsch collapsed within days.","A threat from the Right. It showed the army could not be relied on to defend the republic, but also that ordinary workers would."],
[1920,"Dec 1920",3,"The Nazis buy a newspaper","The party bought the Völkischer Beobachter (People’s Observer), which became its own newspaper.","Gave the Nazis a way to spread their ideas to many more people."],
[1921,"Apr 1921",1,"Reparations set at £6,600 million","The Allies fixed the reparations bill at £6,600 million, to be paid in yearly instalments.","A huge burden on an economy already weakened by war. Germany soon struggled to pay, which led to the occupation of the Ruhr."],
[1921,"Jul 1921",3,"Hitler becomes party leader","Hitler threatened to leave the party unless he was made leader. Drexler stepped aside, and Hitler took full control.","The party was now Hitler’s. The ‘leader principle’ (Führerprinzip) meant he alone made the decisions."],
[1921,"Oct 1921",3,"The SA is set up","The Sturmabteilung (SA), or stormtroopers, was formed, mostly from ex-soldiers and unemployed young men. They wore brown shirts.","The SA protected Nazi meetings and attacked opponents, giving the party a violent, disciplined image."],
[1922,"Jun 1922",1,"Foreign Minister Rathenau murdered","Walther Rathenau was shot by right-wing extremists. Between 1919 and 1922 there were hundreds of political murders, most of them by the Right.","Showed the violence of the extreme Right. Judges were often lenient towards right-wing killers, which suggested sympathy for them."],
[1923,"Jan 1923",1,"French and Belgian troops occupy the Ruhr","When Germany failed to pay reparations, French and Belgian troops occupied the Ruhr, Germany’s main industrial area, to take goods instead. The government told workers to go on strike (passive resistance) and kept paying them.","Paying striking workers meant printing more money. Industrial output collapsed, and this pushed Germany into hyperinflation."],
[1923,"Aug 1923",2,"Stresemann becomes chancellor","Gustav Stresemann was chancellor for about 100 days, then served as foreign minister until his death in 1929. In September he called off passive resistance in the Ruhr.","The start of Germany’s recovery. Stresemann ended the Ruhr crisis and began to rebuild trust with Britain and France."],
[1923,"Nov 1923",1,"Hyperinflation peaks","Prices rose so fast that money became worthless. A loaf of bread that cost under 1 mark in 1921 cost over 200,000 million marks by November 1923. Workers were paid daily and rushed to spend their wages.","Savers and people on fixed incomes, such as pensioners, lost everything. Borrowers could pay off debts cheaply. Many middle-class Germans blamed the republic."],
[1923,"Nov 1923",2,"The Rentenmark introduced","Stresemann replaced the worthless mark with a new temporary currency, the Rentenmark, backed by Germany’s land and industry. In 1924 it was replaced by the Reichsmark.","It ended hyperinflation and restored confidence in German money."],
[1923,"8 – 9 Nov 1923",3,"The Munich Putsch","Hitler and his supporters took over a meeting in a Munich beer hall and tried to seize power in Bavaria, with the support of General Ludendorff. The next day armed police stopped their march through Munich. Shots were fired, 14 Nazis were killed, and Hitler was arrested.","A failure, but Hitler learned he must win power by legal means, through elections."],
[1924,"Feb – Apr 1924",3,"Hitler’s trial","Hitler used his trial for treason to make speeches that were reported across Germany. He was sentenced to five years in Landsberg prison but served only nine months.","Made Hitler a national figure. The light sentence showed that judges were sympathetic to the Right."],
[1924,"1924 – 1929",2,"The ‘Golden Years’ of recovery","Industry grew, unemployment fell, wages rose and new housing was built. Berlin became famous for its art, film and nightlife.","Support for extreme parties fell. But the recovery rested on US loans that could be recalled at any time."],
[1924,"Aug 1924",2,"The Dawes Plan","An American banker, Charles Dawes, helped to agree a plan that lowered Germany’s yearly reparations payments for a time. The USA would lend Germany 800 million marks.","US loans paid for new factories, roads and housing, and French troops left the Ruhr in 1925. But recovery now depended on American money."],
[1925,"Jul 1925",3,"Mein Kampf published","Hitler wrote Mein Kampf (‘My Struggle’) in prison. It set out his ideas: hatred of Jews and communists, destroying the Treaty of Versailles, and gaining ‘living space’ (Lebensraum) in the east.","It became the bible of the Nazi movement."],
[1925,"Oct 1925",2,"The Locarno Treaties","Germany, Britain, France, Italy and Belgium agreed to keep Germany’s borders with France and Belgium as set at Versailles.","Germany was treated as an equal again, not an outcast. It improved relations with France and paved the way into the League of Nations."],
[1926,"Feb 1926",3,"The Bamberg Conference","Hitler won a dispute with party members, such as Gregor Strasser, who wanted more socialist policies. He confirmed his total control of the party.","Part of the reorganisation of the party, 1924–28, which made it a national party ready to fight elections."],
[1926,"Jul 1926",3,"The Hitler Youth founded","The party set up the Hitler Youth to recruit young people. The SS, set up in 1925 as Hitler’s bodyguard, grew too.","Part of the reorganisation: the party built organisations to reach every group in society."],
[1926,"Sep 1926",2,"Germany joins the League of Nations","Germany was admitted to the League and given a permanent seat on its Council, alongside Britain, France, Italy and Japan.","Germany was accepted back as a great power. Nationalists still complained it meant accepting the Treaty of Versailles."],
[1928,"May 1928",3,"Nazis win only 12 seats","In the Reichstag election the Nazis won just 12 seats. With Germany prosperous, few people wanted extreme parties.","The ‘lean years’: until the Depression, Nazi support stayed small."],
[1928,"Aug 1928",2,"The Kellogg-Briand Pact","Germany was one of 62 countries that promised not to use war to settle disputes.","Showed Germany was a peaceful, trusted member of the international community."],
[1929,"Jun 1929",2,"The Young Plan","The total reparations bill was cut to about $8 billion, and Germany was given 59 years to pay.","Lowered the burden and allowed lower taxes. But nationalists, including Hitler, campaigned against paying anything at all, which gave the Nazis publicity."],
[1929,"Oct 1929",2,"Stresemann dies","Stresemann died of a stroke in early October 1929, weeks before the Wall Street Crash.","Germany lost its most able politician just as the Depression was about to hit."],
[1929,"Oct 1929",3,"The Wall Street Crash","The US stock market collapsed. American banks called in their loans to Germany, and German businesses closed. Unemployment rose to about 6 million by 1932.","The Great Depression gave the Nazis their chance. Desperate people turned to extreme parties that promised to solve their problems."],
[1930,"Mar 1930",3,"Brüning rules by decree","Heinrich Brüning became chancellor. Without a majority in the Reichstag, he governed through President Hindenburg’s emergency powers (Article 48).","His cuts to wages and unemployment pay made him unpopular. Democracy was already being bypassed before Hitler came to power."],
[1930,"Sep 1930",3,"Nazi breakthrough: 107 seats","In the Reichstag election the Nazis rose from 12 to 107 seats, becoming the second-largest party.","The Depression had turned the Nazis into a mass party."],
[1932,"Apr 1932",3,"Hitler runs for president","Hitler stood against Hindenburg in the presidential election and came second, with over 13 million votes. He flew from city to city to speak to rallies.","Hindenburg won, but Hitler’s campaign made him famous across Germany. Nazi methods: modern propaganda, mass rallies and Hitler as a strong leader."],
[1932,"Jun 1932",3,"Von Papen becomes chancellor","Franz von Papen, a conservative aristocrat, was made chancellor by Hindenburg, encouraged by General Kurt von Schleicher. He had little support in the Reichstag.","Germany was now run by a small group around the president, who hoped to use Hitler to gain popular support."],
[1932,"Jul 1932",3,"Nazis become the largest party","In the Reichstag election the Nazis won 230 seats and about 37% of the vote. Hitler demanded to be made chancellor, but Hindenburg refused.","The high point of the Nazi vote in a free election."],
[1932,"Nov 1932",3,"Nazi vote falls","In another election the Nazis won 196 seats, losing 34. The party was short of money and some members were losing heart.","Hitler’s support seemed to have peaked. He came to power through a deal, not a majority."],
[1932,"Dec 1932",3,"Von Schleicher becomes chancellor","Schleicher replaced Papen as chancellor and tried to split the Nazis by offering a post to Gregor Strasser. He failed to win support.","Papen, angry at being pushed out, plotted to bring back himself as vice-chancellor under Hitler."],
[1933,"30 Jan 1933",3,"Hitler becomes chancellor","Persuaded by Papen, Hindenburg appointed Hitler chancellor, with Papen as vice-chancellor. Only two other Nazis were in the cabinet.","Papen thought he could control Hitler. Within 18 months Hitler had made himself dictator."],
[1933,"27 Feb 1933",4,"The Reichstag Fire","The Reichstag building was burned down. A young Dutch communist, Marinus van der Lubbe, was arrested. The next day Hindenburg signed a decree suspending civil rights, and thousands of communists were arrested.","Hitler used the fire to claim there was a communist plot, and to silence his opponents before the March election."],
[1933,"Mar 1933",4,"Ministry of Propaganda set up","Joseph Goebbels became Minister of Popular Enlightenment and Propaganda. He controlled newspapers, radio, films and the arts, and organised huge rallies.","Propaganda was a key method of control: making Germans believe in Hitler and Nazi ideas."],
[1933,"23 Mar 1933",4,"The Enabling Act","The Reichstag voted 444 to 94 to give Hitler’s government the power to make laws without it, for four years. SA men surrounded the building, and communist deputies were barred.","The legal basis of Hitler’s dictatorship. The Reichstag had voted away its own power."],
[1933,"Apr 1933",4,"The Gestapo set up","The Gestapo, the secret state police, was set up. It could arrest people and send them to concentration camps without trial.","The heart of the police state. Fear of informers kept many Germans quiet."],
[1933,"2 May 1933",4,"Trade unions banned; Labour Front set up","Trade unions were closed down and their leaders arrested. Workers had to join the German Labour Front (DAF), run by Robert Ley.","Workers lost the right to strike or bargain for higher wages. The Labour Front controlled working life."],
[1933,"10 May 1933",4,"Book burnings","Students and Nazis burned books by Jewish, communist and other ‘un-German’ writers in cities across Germany.","Censorship: only ideas the Nazis approved of were allowed."],
[1933,"1933 – 1939",4,"Women: ‘Children, Kitchen, Church’","Women were encouraged to leave work and have large families. Marriage loans were offered, and mothers of large families were awarded the Honour Cross.","The Nazi ideal of women as wives and mothers. But from 1937 women were needed in industry again as rearmament grew."],
[1933,"1933 – 1939",4,"Unemployment falls","Unemployment fell from 6 million in 1933 to about half a million by 1939, through public works, rearmament, conscription and the Labour Service.","A major reason many Germans supported Hitler. But Jews and women removed from jobs were not counted, and wages stayed low."],
[1933,"Jul 1933",4,"One-party state","A law banned all political parties except the Nazis.","Germany was now a one-party state. Opposition could only be illegal."],
[1933,"20 Jul 1933",4,"The Concordat with the Catholic Church","Hitler signed an agreement with the Pope: the Church would stay out of politics and the Nazis would leave Catholic schools and worship alone.","Hitler soon broke it, closing Catholic schools and youth groups and arresting priests."],
[1933,"Nov 1933",4,"Strength Through Joy","The Labour Front set up Strength Through Joy (KdF), which gave workers cheap holidays, concerts and sports. Workers could save for a ‘people’s car’, the Volkswagen.","Rewarded workers for longer hours and lost rights, and kept their free time under Nazi control. No saver ever received a car."],
[1934,"30 Jun 1934",4,"The Night of the Long Knives","The SS arrested about 200 SA leaders, and many were shot, including the SA leader Ernst Röhm. Hitler also had old enemies killed, such as von Schleicher and Gregor Strasser. Around 90 people are thought to have died.","Hitler removed a rival and won over the army, which feared the SA. He showed he would kill to stay in power."],
[1934,"1934",4,"The Confessing Church","Protestants who refused to accept the Nazi-controlled Reich Church set up the Confessing Church, led by Pastor Martin Niemöller. Niemöller was sent to a concentration camp in 1937.","Showed the limits of Nazi control over the Churches, and the price of opposing them."],
[1934,"2 Aug 1934",4,"Hitler becomes Führer","When President Hindenburg died, Hitler combined the posts of chancellor and president and called himself Führer. Soldiers swore an oath of loyalty to Hitler personally.","Hitler now had complete power. The army was tied to him by oath."],
[1935,"Jun 1935",4,"Labour Service made compulsory","All men aged 18 to 25 had to do six months in the National Labour Service (RAD), building roads, draining marshes and planting forests.","Helped cut unemployment, along with rearmament and public works such as the autobahns."],
[1935,"Sep 1935",4,"The Nuremberg Laws","Jews lost German citizenship, and marriages and relationships between Jews and non-Jews were banned.","Persecution was now written into law."],
[1936,"Dec 1936",4,"The Hitler Youth Law","All other youth groups had been banned. Now all young people were expected to join a Nazi youth organisation, and in 1939 membership became compulsory. Boys trained for the army; girls in the League of German Maidens trained to be wives and mothers.","The Nazis aimed to win over the young. Schools and teachers had to teach Nazi ideas too."],
[1938,"9 – 10 Nov 1938",4,"Kristallnacht","After a German diplomat was shot in Paris by a young Jew, the Nazis organised attacks on Jewish shops, homes and synagogues across Germany. 91 Jews were killed and about 30,000 Jewish men were arrested and sent to concentration camps.","The ‘Night of Broken Glass’ marked a shift from discrimination to open violence against Jews."],
[1939,"Aug 1939",5,"Rationing begins","Just before the war, rationing of bread, meat, dairy products and soap began; clothing followed in November. In May 1942 rations were cut.","The Home Front: shortages grew worse as the war went on, though Germany took food from the countries it conquered."],
[1939,"Sep 1939",5,"War begins","Germany invaded Poland. Two days later Britain and France declared war.","The start of the Second World War, which brought the Nazis’ worst crimes and, in the end, the destruction of the Third Reich."],
[1940,"1939 – 1941",5,"Ghettos in Poland","Jews in occupied Poland were forced into sealed ghettos, such as those in Warsaw and Łódź. Overcrowding, starvation and disease killed many thousands.","A step towards mass murder: Jews were separated, robbed and starved."],
[1941,"Jun 1941",5,"Death squads in the East","When Germany invaded the Soviet Union, SS death squads (Einsatzgruppen) followed the army and shot Jews, communists and others in mass killings.","The Holocaust began with mass shootings. Over a million people were killed this way."],
[1941,"Oct 1941",5,"Forced labour from the East","Hitler allowed Soviet prisoners of war to be brought to Germany as slave labour. By 1944 over 7 million prisoners and foreign workers were working for German industry.","Germany had a growing shortage of workers. Forced labour kept the war economy going at a terrible cost in lives."],
[1942,"Jan 1942",5,"The Wannsee Conference","Senior Nazis met at Wannsee, near Berlin, to plan the ‘Final Solution’: the murder of all of Europe’s Jews.","Genocide was now organised across Europe."],
[1942,"1942 – 1945",5,"The death camps","Jews from across Europe were sent by train to death camps such as Auschwitz-Birkenau and Treblinka and murdered in gas chambers.","About 6 million Jews were killed in the Holocaust, along with many Roma, Slavs, disabled people and others."],
[1943,"Feb 1943",5,"‘Total war’","After defeat at Stalingrad, Goebbels told Germans they were now fighting a ‘total war’. All men aged 16–65 and women aged 17–45 had to register for work, and businesses not needed for the war were closed.","Every part of German life was now geared to the war. Women were needed in factories, despite Nazi ideas about women."],
[1943,"22 Feb 1943",5,"The White Rose executed","Hans and Sophie Scholl, Munich students in the White Rose group, were caught handing out leaflets attacking the Nazis. They were executed.","Brave but small: student opposition did not shake Nazi control."],
[1943,"Jul 1943",5,"The bombing of Hamburg","Allied air raids on Hamburg in the summer of 1943 killed 42,600 civilians and forced about a million people to flee the city.","Allied bombing destroyed homes and factories and killed hundreds of thousands of German civilians. It damaged morale, but did not end the war."],
[1944,"20 Jul 1944",5,"The July Bomb Plot","Army officers led by Colonel Claus von Stauffenberg planted a bomb at Hitler’s headquarters. It exploded, but Hitler survived.","The most serious attempt to kill Hitler. About 7,000 people were arrested, and thousands were executed."],
[1944,"Oct 1944",5,"The Volkssturm","A Home Guard, the Volkssturm, was set up from men too old or too young for the army. By the end, boys as young as 12 were being made to fight.","Showed how desperate Germany had become as the Allies closed in."],
[1944,"Nov 1944",5,"Edelweiss Pirates hanged","Thirteen people linked to the Edelweiss Pirates were publicly hanged in Cologne. The Pirates, mostly working-class young people, had spread since 1937; they hated the Hitler Youth and mocked Nazi culture.","Showed growing opposition among the young, and how harshly it was punished."],
[1945,"Feb 1945",5,"The bombing of Dresden","Allied raids destroyed the city of Dresden, killing around 25,000 people.","By 1945 German cities lay in ruins and millions were homeless."],
[1945,"30 Apr 1945",5,"Hitler’s death","With Soviet troops fighting in the streets of Berlin, Hitler shot himself in his bunker.","The end of Hitler’s rule. Goebbels killed himself the next day."],
[1945,"May 1945",5,"Germany surrenders","Germany surrendered unconditionally to the Allies on 7–8 May 1945.","The end of the Third Reich. Germany was occupied and divided by the Allies."]

[1840,"1840s – 1860s",1,"Miasma: the ‘bad air’ theory","Most doctors believed disease was caused by miasma: poisonous bad air given off by rotting rubbish, sewage and dead bodies.","The biggest barrier to progress. Without knowing that germs cause disease, doctors could not prevent or cure it, although cleaning up smells sometimes helped by accident."],
[1840,"1840s – 1860s",1,"Spontaneous generation","Scientists who saw microorganisms under the microscope thought they were produced by disease, not the cause of it. This idea was called spontaneous generation.","A barrier to progress: it stopped scientists linking microorganisms to illness until Pasteur disproved it."],
[1842,"1842",1,"Chadwick’s report on living conditions","Edwin Chadwick’s report showed that poor people in towns lived much shorter lives than the better off. He blamed filthy living conditions and called for drains, sewers, clean water and rubbish removal.","It linked dirt with disease and made the case for government action on public health, which led to the 1848 Public Health Act."],
[1846,"Dec 1846",1,"Liston operates using ether","After hearing of the American dentist William Morton’s use of ether, Robert Liston amputated a leg in London with the patient unconscious.","Anaesthetics began to solve the problem of pain. But ether irritated the lungs, made patients cough, and was highly flammable."],
[1847,"Nov 1847",1,"Simpson discovers chloroform","James Simpson, an Edinburgh doctor, tested chemicals on himself and his friends and found that chloroform made them unconscious.","Chloroform was easier to use than ether and became the most popular anaesthetic. It solved the problem of pain in surgery."],
[1848,"Jan 1848",1,"Hannah Greener dies under chloroform","Fifteen-year-old Hannah Greener died from chloroform given before a minor operation to remove a toenail.","Showed that the right dose was hard to judge. Fears about safety slowed the acceptance of anaesthetics."],
[1848,"1848",1,"The 1848 Public Health Act","After a cholera threat, the Act set up a General Board of Health, with Chadwick as one of its commissioners. Towns could set up local boards to employ a medical officer, remove rubbish and build sewers.","A first step, but its impact was limited: towns were allowed to act but not forced to, and many did nothing. The General Board of Health ended in 1854."],
[1849,"1848 – 1849",1,"The cholera epidemic","Cholera swept through Britain’s overcrowded towns, killing tens of thousands of people. Victims could die within a day from severe diarrhoea.","Cholera terrified people because it killed rich as well as poor. Fear of it pushed governments towards public health reform."],
[1850,"1850s – 1870s",1,"The ‘black period’ of surgery","With anaesthetics, surgeons attempted longer and more complicated operations. But they still worked in ordinary clothes with unwashed hands and instruments, and did not understand infection.","Anaesthetics solved pain but death rates from infection rose. Infection and bleeding were still unsolved problems."],
[1853,"1853",1,"Queen Victoria uses chloroform","Queen Victoria was given chloroform during the birth of her son Leopold.","If the Queen used it, it must be safe: her use helped make anaesthetics acceptable."],
[1854,"1854",1,"Snow and the Broad Street pump","During a cholera outbreak in Soho, London, John Snow mapped the deaths and found they clustered around a water pump in Broad Street. He had the pump handle removed. He also found that workers at a nearby brewery, who drank beer rather than water, escaped the disease.","Snow proved that cholera spread through dirty water, not bad air. But without germ theory, many did not accept his explanation at first."],
[1854,"Nov 1854",1,"Nightingale arrives at Scutari","During the Crimean War, Florence Nightingale took 38 nurses to the army hospital at Scutari. They found almost 10,000 patients in filthy, overcrowded wards. They cleaned the wards, washed bedding and equipment, opened windows and improved food.","Nightingale became famous as ‘the Lady with the Lamp’. The death rate fell sharply after a government Sanitary Commission repaired the drains and water supply in 1855."],
[1858,"1858",1,"The Great Stink","In a hot summer, the River Thames, full of sewage, smelled so bad that Parliament could hardly meet.","It pushed the government into paying for a new sewer system for London."],
[1859,"1859 – 1875",1,"Bazalgette builds London’s sewers","The engineer Joseph Bazalgette designed a vast network of sewers that carried London’s waste away from the city, downstream into the Thames.","London’s water became much cleaner. When cholera returned in 1866, areas linked to the new sewers were largely spared."],
[1859,"1859",2,"Nightingale’s Notes on Nursing","Nightingale published Notes on Nursing and Notes on Hospitals. They stressed cleanliness, fresh air and good design, and recommended the ‘pavilion’ plan for hospitals with separate airy wards.","Her ideas shaped the design of new hospitals and the way nurses worked."],
[1860,"1860",2,"The Nightingale School of nursing","The Nightingale School for training nurses opened at St Thomas’ Hospital in London, paid for by money raised in Nightingale’s honour.","Nursing became a respected, trained profession for women."],
[1861,"1861",2,"Pasteur’s germ theory","Louis Pasteur, a French chemist, showed that microorganisms in the air cause liquids to go bad. His experiments with swan-necked flasks disproved spontaneous generation.","Germ theory was the turning point: it showed that germs cause decay, and soon disease. It led to antiseptics, vaccines and better public health."],
[1865,"1865",2,"Elizabeth Garrett qualifies","Refused entry to medical schools, Elizabeth Garrett studied privately and passed the exams of the Society of Apothecaries, which could not legally stop her. She was licensed to practise medicine.","The first woman to qualify as a doctor in Britain. The Society then changed its rules to stop other women doing the same."],
[1865,"Aug 1865",2,"Lister first uses carbolic acid","After reading Pasteur’s work, Joseph Lister treated a boy’s badly broken leg with bandages soaked in carbolic acid. The wound healed without infection.","The start of antiseptic surgery: fighting infection by killing germs."],
[1866,"1866",2,"Cholera returns to London","Another cholera epidemic hit London. It struck hardest in the East End, which was not yet linked to Bazalgette’s new sewers.","Supported Snow’s ideas and showed that government spending on sewers and clean water saved lives."],
[1867,"1867",2,"Lister publishes his results","Lister published his results. Amputation death rates in his own records fell from about 46% without antiseptics to 15% with them. He went on to develop a carbolic spray to kill germs in the air during operations.","Strong evidence for antiseptics. But many surgeons opposed them at first: carbolic was unpleasant, slowed operations and stung their hands."],
[1867,"1867",2,"The Second Reform Act","Many working men in towns were given the vote.","Politicians now needed working-class votes, which encouraged them to improve living conditions and public health."],
[1869,"1869",2,"Jex-Blake at Edinburgh","Sophia Jex-Blake and four other women persuaded Edinburgh University to let them study medicine. They faced harassment from male students, and in 1874 the university forced them to leave.","Showed the strong opposition women faced. Jex-Blake helped found the London School of Medicine for Women in 1874."],
[1870,"1870",2,"Garrett gains a medical degree","Elizabeth Garrett gained a medical degree from the University of Paris, as British universities would not give her one. In 1872 she opened the New Hospital for Women in London.","Proved women could succeed as doctors and opened a path for others."],
[1875,"1875",2,"The 1875 Public Health Act","Local councils were forced to provide clean water, sewers and drainage, and to remove rubbish. Every area had to appoint a medical officer of health and a sanitary inspector.","Unlike 1848, action was now compulsory. A turning point: government accepted responsibility for public health."],
[1875,"1875",2,"The Artisans’ Dwellings Act","Councils were given the power to buy and knock down slum housing and build better homes.","Improved housing helped health, though few councils used the power at first."],
[1876,"1876",3,"Koch identifies the anthrax germ","Robert Koch, a German doctor, proved that a particular microorganism caused anthrax, a disease of animals and people.","The first time a specific germ was proved to cause a specific disease. Bacteriology, the study of bacteria, was born."],
[1876,"1876",3,"The Medical Act and women","A new Medical Act allowed women to study medicine and qualify as doctors.","A breakthrough for women, though they still faced prejudice from patients and male doctors for decades."],
[1878,"1878",3,"Pasteur’s Germ Theory and its Applications","Pasteur published Germ Theory and its Applications to Medicine and Surgery.","Spread the germ theory among doctors and surgeons and encouraged hygiene in operations."],
[1879,"1879",3,"Pasteur’s chicken cholera vaccine","Pasteur’s team found that chickens injected with an old, weakened culture of chicken cholera did not fall ill, and were then protected from fresh germs.","Showed that weakened germs could be used to make vaccines against many diseases."],
[1880,"1880s – 1890s",3,"Aseptic surgery","Surgeons moved from killing germs (antiseptic) to keeping them away (aseptic). Instruments were sterilised with steam, operating theatres were cleaned thoroughly, and surgeons wore gowns, masks and rubber gloves.","Infection in surgery was largely solved, so more complex operations became possible."],
[1881,"1881",3,"Pasteur’s anthrax vaccine","Pasteur proved his anthrax vaccine worked in a public test: vaccinated sheep survived an injection of anthrax germs, while unvaccinated sheep died.","A dramatic public success that made Pasteur famous. Rivalry with Koch pushed both teams to work faster."],
[1882,"1882",3,"Koch identifies the tuberculosis germ","Koch identified the microorganism that causes tuberculosis (TB). His team used dyes to stain bacteria and agar jelly to grow them.","TB was a major killer. Koch’s methods let scientists find the germs behind many other diseases."],
[1883,"1883",3,"Koch identifies the cholera germ","In Egypt, Koch identified the microorganism that causes cholera, carried in dirty water.","Finally proved Snow right, and confirmed the need for clean water and sewers."],
[1885,"1885",3,"Pasteur’s rabies vaccine","Pasteur used his rabies vaccine on a boy, Joseph Meister, who had been bitten by a rabid dog. The boy survived.","The first vaccine created in a laboratory for a human disease."],
[1889,"1889",3,"Infectious Disease (Notification) Act","Doctors had to report cases of infectious diseases such as smallpox and cholera to the local medical officer of health.","Helped councils to isolate patients and stop outbreaks spreading."],
[1895,"Nov 1895",3,"Röntgen discovers X-rays","The German scientist Wilhelm Röntgen found that rays from a cathode ray tube passed through flesh but not bone, and could be recorded on a photographic plate.","Doctors could see inside the body without surgery, to find broken bones and objects such as bullets."],
[1898,"1898",3,"The Curies discover radium","Marie and Pierre Curie discovered two new radioactive elements, polonium and radium.","Led to radiotherapy: using radiation to treat cancer."],
[1899,"1899 – 1902",3,"The Boer War: an unfit nation","Over a third of the volunteers for the army in the Boer War were found unfit to serve. In some slums the figure was much higher.","Shocked the government into acting on the health of the poor: a key reason for the Liberal reforms."],
[1901,"1901",3,"Landsteiner discovers blood groups","The Austrian doctor Karl Landsteiner found that there are different blood groups, and that only some can be mixed safely.","Explained why so many blood transfusions failed, and made safe transfusions possible."],
[1906,"1906",4,"Free school meals","The new Liberal government allowed councils to provide free school meals for children from poor families.","Better nutrition for poor children: the start of the Liberal reforms."],
[1907,"1907",4,"The School Medical Service","Schoolchildren were given regular medical checks. Free treatment followed from 1912.","Found and treated health problems in children early."],
[1908,"1908",4,"Old age pensions","People over 70 with low incomes were given a weekly pension of 25p. About 600,000 pensions were granted in the first year.","Helped old people afford food, housing and heating, so they stayed healthier."],
[1909,"1909",3,"Ehrlich’s magic bullet: Salvarsan 606","Paul Ehrlich’s team tested hundreds of compounds to find one that would kill the germ causing syphilis without harming the body. The 606th worked.","The first chemical cure, or ‘magic bullet’, targeting a specific germ. It encouraged the search for more."],
[1910,"1910",3,"Marie Curie and radiotherapy","A new Radium Institute was built in Paris, where Marie Curie led research into using radiation to shrink or kill tumours.","Radiotherapy became a treatment for cancer."],
[1911,"1911",4,"The National Insurance Act","Workers and employers paid into a scheme. Workers who fell ill got free care from a doctor and sickness benefit, and there was a maternity grant. Some workers could also insure against unemployment.","Stopped illness pushing families into poverty. But it did not cover workers’ wives and children or hospital treatment."],
[1914,"1914 – 1918",4,"Women doctors in the First World War","At first the War Office refused women doctors. Dr Elsie Inglis set up hospitals run by women abroad, and Flora Murray and Louisa Garrett Anderson ran hospitals in France and then the Endell Street Military Hospital in London.","Women proved their skill in surgery and running hospitals. Nurses, including FANY volunteers, worked close to the front lines."],
[1915,"1915",4,"Mobile X-ray units","X-ray machines were used in base hospitals and in mobile units near the front, to find bullets and shrapnel in wounds.","Surgeons could remove fragments quickly and accurately, saving lives and limbs."],
[1915,"1915",4,"The Thomas splint","The Thomas splint, which held a broken leg still, was introduced on the Western Front at the end of 1915.","Survival for soldiers with a broken thigh bone rose from 20% to 82%."],
[1915,"1914 – 1918",4,"Fighting infection in war","Wounds in the farmland of the Western Front were often infected by gas gangrene. Surgeons cut away infected and dead tissue and cleaned wounds with salt solutions.","Infection was a huge killer in the war. There was still no cure for infection once it set in, until penicillin."],
[1917,"1917",4,"Storing blood for transfusion","Scientists found that adding chemicals such as sodium citrate stopped blood clotting, so it could be stored for weeks. Before the Battle of Cambrai, depots of stored blood were set up.","Blood transfusions could now be used on a large scale."],
[1917,"1917",4,"Gillies and plastic surgery","Harold Gillies set up a plastic surgery unit at the Queen’s Hospital in Sidcup, Kent, to rebuild the faces of wounded soldiers using skin grafts.","Plastic surgery developed as a new specialism."],
[1919,"1919",4,"The Ministry of Health","The government set up a Ministry of Health to take charge of public health. Isolation hospitals were created for people with tuberculosis.","Health was now the responsibility of a government department."],
[1919,"1919",4,"‘Homes fit for heroes’","A new Housing Act gave councils money to build homes for working people, to replace slums.","Better housing improved health, though many slums remained."],
[1928,"Sep 1928",5,"Fleming discovers penicillin","Alexander Fleming noticed that mould had killed the bacteria growing on a dish in his laboratory. The mould was penicillin.","The first antibiotic. But Fleming could not produce enough to use, and did not test it on infected animals, so his work stalled."],
[1929,"1929",5,"Councils take over hospitals","The Local Government Act gave councils control of the old workhouse hospitals.","Began to organise hospitals into a more national system."],
[1932,"1932",5,"Domagk and Prontosil","The German scientist Gerhard Domagk found that a red dye, Prontosil, killed the germs that cause blood poisoning in mice. In 1935 he used it to save his own daughter.","The second ‘magic bullet’. Its key ingredient, sulphonamide, led to a family of new drugs."],
[1939,"1939",5,"Florey and Chain begin work on penicillin","Howard Florey and Ernst Chain, at Oxford, began researching penicillin and found ways to purify it.","Turned Fleming’s discovery into a usable drug."],
[1939,"1939",5,"The Emergency Medical Service","At the start of the Second World War, the government organised hospitals into the Emergency Medical Service to treat air-raid casualties and wounded servicemen.","Showed a national health system could work, and how unequal hospital care had been."],
[1939,"Sep 1939",5,"Evacuation reveals poor health","Children evacuated from cities to the countryside were often found to be underfed, dirty and suffering from lice and disease.","Shocked many people about the health of the poor, and built support for change after the war."],
[1940,"1940",5,"Penicillin cures mice","Florey and Chain’s team infected mice with deadly bacteria. The mice given penicillin survived; the others died.","Proved penicillin could cure infections in living creatures."],
[1941,"1941",5,"The first penicillin patient","Albert Alexander, a policeman with severe blood poisoning, was treated with penicillin and began to recover. But the team ran out of the drug and he died.","Showed penicillin could save lives, and that it had to be mass-produced."],
[1941,"1941 – 1945",5,"The Guinea Pig Club","Archibald McIndoe treated badly burned airmen with new skin-graft methods. His patients called themselves the ‘Guinea Pig Club’.","Plastic surgery advanced again, along with care for patients’ confidence and return to normal life."],
[1942,"Dec 1942",5,"The Beveridge Report","William Beveridge’s report named five ‘giant evils’: want, disease, ignorance, squalor and idleness. He proposed a welfare state, including a free national health service.","Hugely popular: it became the plan for Britain after the war."],
[1944,"Jun 1944",5,"Penicillin for D-Day","With American factories mass-producing it, there was enough penicillin to treat all Allied casualties in the D-Day landings.","War drove mass production. Penicillin saved thousands of lives from infected wounds."],
[1946,"1946",5,"The National Health Service Act","Labour’s Health Minister Aneurin Bevan passed the Act to create the NHS. Many doctors opposed it, but Bevan won them round by letting them keep private patients.","The law that created a free health service for everyone."],
[1948,"5 Jul 1948",5,"The NHS begins","Medical care, hospital treatment, dentists and opticians became free to all at the point of use. About 90% of doctors had joined the NHS.","The biggest change in health care in British history: no one had to worry about the cost of being ill."]

const z=n=>String(n).padStart(2,"0");
function dayStr(d=new Date()){return d.getFullYear()+"-"+z(d.getMonth()+1)+"-"+z(d.getDate())}
function parse(s){const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function gap(a,b){return Math.round((Date.UTC(...ymd(b))-Date.UTC(...ymd(a)))/864e5)}
function ymd(s){const[y,m,d]=s.split("-").map(Number);return[y,m-1,d]}

function tone(seq){if(S.muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();let t=AC.currentTime+.01;
  seq.forEach(([f,d,type])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=type||"sine";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d*.75})}catch(e){}}
function noise(dur,f0,f1,vol){if(S.muted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const t=AC.currentTime+.01,n=Math.floor(AC.sampleRate*dur),buf=AC.createBuffer(1,n,AC.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<n;i++)d[i]=(Math.random()*2-1)*(1-i/n);
  const src=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();src.buffer=buf;fl.type="bandpass";fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(f1,t+dur);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(fl);fl.connect(g);g.connect(AC.destination);src.start(t);src.stop(t+dur)}catch(e){}}

/* ---------- lesson building ---------- */
function buildLesson(){
  const P=pool(),today=dayStr(),c=S.cards;
  // Reviews come first: every event that's due, the longest-waiting first (and, among equals, the closest to learned)
  const due=shuffle(P.filter(e=>c[e.id]&&c[e.id].due<=today)).sort((a,b)=>c[a.id].due<c[b.id].due?-1:c[a.id].due>c[b.id].due?1:c[b.id].box-c[a.id].box);
  let fresh=P.filter(e=>!c[e.id]);
  // When mixing units, take new events from each unit in turn
  const us=unitsOf(S.unit);
  if(us.length>1){const q=us.map(u=>fresh.filter(e=>e.u===u));fresh=[];while(q.some(x=>x.length))q.forEach(x=>{if(x.length)fresh.push(x.shift())})}
  // New events only take the places left over
  let picks=due.slice(0,LEN);
  picks=picks.concat(fresh.slice(0,Math.min(MAX_NEW,LEN-picks.length)));
  if(picks.length<LEN){const rest=shuffle(P.filter(e=>!picks.includes(e)&&c[e.id])).sort((a,b)=>c[a.id].box-c[b.id].box);picks=picks.concat(rest.slice(0,LEN-picks.length))}
  if(picks.length<LEN)picks=picks.concat(fresh.filter(e=>!picks.includes(e)).slice(0,LEN-picks.length));
  return shuffle(picks).map(e=>makeQ(e));
}
function makeQ(e,forceType){
  const box=(S.cards[e.id]||{box:0}).box;
  let t=forceType;
  if(!t){
    const opts=box===0?["what","what","when"]:box===1?["what","when","why"]:["when","why","order","why"];
    t=rnd(opts);
  }
  if((t==="when"||t==="order")&&!e.single)t=rnd(["what","why"]);
  const same=ALL.filter(x=>x.u===e.u&&x!==e);
  if(t==="order"){
    const cand=shuffle(same.filter(x=>x.single&&Math.abs(x.fy-e.fy)>=1));
    const picked=[e];for(const x of cand){if(picked.every(p=>p.fy!==x.fy))picked.push(x);if(picked.length===3)break}
    if(picked.length<3)return makeQ(e,"what");
    return{t,e,items:shuffle(picked)};
  }
  if(t==="when"){
    const [lo,hi]=UNIT_YEARS[e.u],ys=new Set([e.fy]);
    const near=shuffle([-4,-3,-2,-1,1,2,3,4].map(n=>e.fy+n).filter(y=>y>=lo&&y<=hi));
    for(const y of near){if(ys.size>=4)break;ys.add(y)}
    return{t,e,options:shuffle([...ys]).map(y=>({label:String(y),ok:y===e.fy}))};
  }
  const dis=shuffle(same.filter(x=>x.h!==e.h)).slice(0,3);
  return{t,e,options:shuffle([e,...dis]).map(x=>({label:x.h,ok:x===e}))};
}

let L=null;

function header(){return `<div class="lhead"><button class="iconbtn" id="quit" aria-label="Quit challenge">${CLOSE}</button><div class="lbar" role="progressbar" aria-valuemin="0" aria-valuemax="${L.total}" aria-valuenow="${L.done}"><i style="width:${Math.max(4,L.done/L.total*100)}%"></i></div></div>`}

function grade(){
  const q=L.q;L.answered=true;let ok;
  if(q.t==="order"){
    const right=q.items.map((x,i)=>i).sort((a,b)=>q.items[a].key-q.items[b].key);

    L.correctOrder=right;

  if(firstTry){

    else{c.box=Math.max(0,c.box-1);c.due=dayStr()}

  ok?SND.right():SND.wrong();

  else{
    fact=`${ok?"":`<strong>Correct answer${q.t==="when"?": "+e.fy:""}</strong><br>`}<span class="d">${esc(e.d)}</span> · <strong>${esc(e.h)}</strong><br>${esc(e.s)}`;
    viz=strip(e,(q.t==="when"&&!ok)?+q.options[L.sel].label:null);

  app.querySelector(".foot").style.visibility="hidden";
  document.body.appendChild(sheet);

  $("#cont").focus();
  $("#cont").onclick=()=>{sheet.remove();app.style.paddingBottom="";
    $(".lbar i")&&($(".lbar i").style.width=Math.max(4,L.done/L.total*100)+"%");
    nextQ()};
  $("#tl").onclick=()=>openTimeline(e.u,e.id,"lesson");
}
function finish(){

/* ---------- timeline helpers ---------- */
const TL_ICON=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M5 4v16M5 7h10M5 12h14M5 17h8"/></svg>`;
const BACK=`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>`;
const yrsLabel=(a,b)=>a===b?String(a):`${a}–${String(a).slice(0,2)===String(b).slice(0,2)?String(b).slice(2):b}`;
// A short strip of the timeline around one event (2 before, 2 after), plus the player's wrong year if given
function strip(e,guess){
  const U=ALL.filter(x=>x.u===e.u).slice().sort((a,b)=>a.key-b.key);
  const i=U.indexOf(e),start=Math.max(0,Math.min(i-2,U.length-5)),W=U.slice(start,start+5);
  const ys=W.map(x=>x.fy).concat(guess!=null?[guess]:[]);
  const lo=Math.min(...ys),hi=Math.max(...ys),sameYear=lo===hi&&W.every(x=>x.single);
  const lbl=x=>{const t=sameYear?x.d.replace(/\s*\d{4}$/,""):x.d;return t||x.d};
  const rows=W.map(x=>({k:x.key,h:`<div class="srow${x===e?" cur":""}"><span class="sd">${esc(lbl(x))}</span><span class="sdot"></span><span class="st">${esc(x.h)}</span></div>`}));
  if(guess!=null){
    const diff=guess-e.fy,n=Math.abs(diff);
    const m={k:guess*100,h:`<div class="srow guess"><span class="sd">${guess}</span><span class="sdot"></span><span class="st">You said ${guess}: ${n} year${n>1?"s":""} too ${diff<0?"early":"late"}</span></div>`};
    const at=rows.findIndex(r=>r.k>=m.k);if(at<0)rows.push(m);else rows.splice(at,0,m);
  }
  return `<div class="strip slist"><div class="shead"><span>Where it fits · ${yrsLabel(lo,hi)}</span></div>${rows.map(r=>r.h).join("")}</div>`;
}
// The three events of an order question on a year ruler, with the gaps between them
function ruler(items,ok){
  const fr=x=>x.fy+(((x.key%100)||6)-0.5)/12, f=items.map(fr);
  // Events less than 18 months apart are drawn on a month scale, otherwise a year scale
  let a=Math.floor(f[0]),b=Math.ceil(f[2]),step=1,hy=[a,b];
  if(f[2]-f[0]<1.5){a=Math.floor(f[0]*12-1)/12;b=Math.ceil(f[2]*12+1)/12;step=1/12;hy=[items[0].fy,items[2].fy]}
  else{if(b-a<2)b=a+2;if(b-a>15)step=5;hy=[a,b]}
  const P=v=>5+(v-a)/(b-a)*90;
  let h='<div class="rline"></div>';
  for(let y=a;y<=b+1e-9;y+=step)h+=`<i class="rtick" style="left:${P(y)}%"></i>`;
  const mo=x=>x.fy*12+(((x.key%100)||6)-1);
  [0,1].forEach(j=>{const dm=mo(items[j+1])-mo(items[j]),d=items[j+1].fy-items[j].fy,p1=P(f[j]),p2=P(f[j+1]);
    const txt=dm<12?(dm<=0?"same month":dm+" month"+(dm>1?"s":"")):d+" year"+(d>1?"s":"");
    if(p2-p1>=30)h+=`<span class="rgap" style="left:${(p1+p2)/2}%">${txt}</span>`});
  const lab=x=>`<b>${esc(x.d)}</b>${esc(x.h)}`, pm=P(f[1]);
  const midPos=pm<30?"left:0":pm>70?"right:0;text-align:right":`left:${pm}%;transform:translateX(-50%);text-align:center`;
  h+=`<div class="rlab up" style="left:0">${lab(items[0])}</div><i class="rstem up" style="left:${P(f[0])}%"></i>`;
  h+=`<div class="rlab up" style="right:0;text-align:right">${lab(items[2])}</div><i class="rstem up" style="left:${P(f[2])}%"></i>`;
  h+=`<div class="rlab dn" style="${midPos}">${lab(items[1])}</div><i class="rstem dn" style="left:${pm}%"></i>`;
  f.forEach(v=>h+=`<i class="rdot" style="left:${P(v)}%"></i>`);
  return `<div class="strip"><div class="shead"><span>${ok?"How far apart":"The right order"} · ${yrsLabel(hy[0],hy[1])}</span></div><div class="ruler">${h}</div></div>`;
}

function startTour(){if(tourOn)return;tourOn=true;tourI=0;document.body.style.paddingBottom="45vh";window.scrollTo(0,0);showTour()}
function endTour(){tourMove++;const o=$(".tour");if(o)o.remove();tourOn=false;S.tourDone=true;save();window.removeEventListener("resize",placeTour);tourToTop()}
// After the tour, glide back to the top of the home screen, ready to play; then remove the tour's extra space
function tourToTop(){
  const id=tourMove,from=scrollY,unpad=()=>{document.body.style.paddingBottom=""};
  if(!from||matchMedia("(prefers-reduced-motion: reduce)").matches){window.scrollTo(0,0);unpad();return}
  const dur=Math.min(1200,500+from*0.8),t0=performance.now(),ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  const step=()=>{
    if(id!==tourMove||tourOn||L||tlOpen){unpad();return}
    const k=Math.min(1,(performance.now()-t0)/dur);
    window.scrollTo(0,from*(1-ease(k)));

}
function showTour(){
  const steps=tourSteps(),st=steps[tourI];
  let o=$(".tour");
  if(!o){o=document.createElement("div");o.className="tour";o.setAttribute("role","dialog");o.setAttribute("aria-modal","true");o.setAttribute("aria-label","Welcome tour");document.body.appendChild(o);window.addEventListener("resize",placeTour)}

  o.innerHTML=`${st.sel?'<div class="hole"></div>':'<div class="shade"></div>'}<div class="tcard" aria-live="polite">
    ${st.mood?mascot(st.mood):""}<h2>${esc(st.title)}</h2><p>${esc(st.text)}</p>
    ${st.final?`<div class="finalbtns"><button class="btn" id="tourGo">${S.last?"Got it":"Start my first challenge"}</button>${S.last?"":'<button class="btn ghost" id="tourLater">Not now</button>'}</div>`
      :`<div class="trow"><span class="dots" aria-label="Step ${tourI+1} of ${steps.length}">${dots}</span><span class="tbtns"><button class="skip" id="tourSkip">Skip</button><button class="btn" id="tourNext">Next</button></span></div>`}
  </div>`;
  if(st.final){$("#tourGo").onclick=()=>{endTour();if(!S.last||S.last!==dayStr()){SND.tap();if(!S.last)startLesson()}};const l=$("#tourLater");if(l)l.onclick=endTour;$("#tourGo").focus()}
  else{$("#tourNext").onclick=()=>{tourI++;showTour()};$("#tourSkip").onclick=endTour;$("#tourNext").focus()}

  if(matchMedia("(prefers-reduced-motion: reduce)").matches){el.scrollIntoView({block:"center",behavior:"auto"});requestAnimationFrame(placeTour);return}
  // Scroll smoothly so the player sees where on the page each thing lives
  // (a fixed, gentle speed rather than the browser's own smooth scroll, which is quick and varies by device)
  o.classList.add("moving");placeTour();
  const r=el.getBoundingClientRect(),max=document.documentElement.scrollHeight-innerHeight,from=scrollY;
  let top=innerHeight/2-r.height/2;
  if(st.bottom){const room=innerHeight-o.querySelector(".tcard").offsetHeight-tourBottomGap()-22;top=Math.max(20,room-r.height)}
  const to=Math.max(0,Math.min(max,from+r.top-top)),dist=Math.abs(to-from);
  const dur=dist<4?0:Math.min(1200,500+dist*0.8),t0=performance.now();
  const ease=x=>x<.5?2*x*x:1-Math.pow(-2*x+2,2)/2;
  const follow=()=>{
    if(id!==tourMove||!tourOn)return;
    const k=dur?Math.min(1,(performance.now()-t0)/dur):1;
    window.scrollTo(0,from+(to-from)*ease(k));placeTour();

}
// Gap between a bottom card and the bottom of the screen (allowing for the phone's gesture bar)
function tourBottomGap(){const t=document.createElement("div");t.style.cssText="position:fixed;height:env(safe-area-inset-bottom,0px)";document.body.appendChild(t);const h=t.offsetHeight;t.remove();return 16+h}
// Put the highlight round the step's element and the card in whichever half of the screen is free
function placeTour(){
  const o=$(".tour");if(!o)return;
  const st=tourSteps()[tourI],card=o.querySelector(".tcard"),hole=o.querySelector(".hole"),el=st.sel&&document.querySelector(st.sel);
  card.style.bottom="";
  if(!el||!hole){card.style.top="50%";card.style.transform="translateY(-50%)";return}
  const r=el.getBoundingClientRect(),pad=8;
  Object.assign(hole.style,{left:(r.left-pad)+"px",top:(r.top-pad)+"px",width:(r.width+pad*2)+"px",height:(r.height+pad*2)+"px"});
  card.style.transform="";
  if(st.bottom){card.style.top="auto";card.style.bottom=tourBottomGap()+"px";return}
  const ch=card.offsetHeight,below=innerHeight-r.bottom;
  if(below>ch+28){card.style.top=(r.bottom+pad+14)+"px"}else{card.style.top=Math.max(12,r.top-pad-14-ch)+"px"}
}

/* ---------- timeline challenge ---------- */
let CH=null,chOpen=false;
const chWeak=e=>{const c=S.cards[e.id];return c?c.box:0.5};
// Events of a unit whose order is unambiguous: in date order, a month known (or the only event that year), no ties
function chDeck(u){
  const U=ALL.filter(e=>e.u===u).slice().sort((a,b)=>a.key-b.key),per={};
  U.forEach(e=>per[e.fy]=(per[e.fy]||0)+1);
  const span=e=>{const m=e.d.match(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/g)||[],y=e.d.match(/\d{4}/g)||[];return m.length>1||new Set(y).size>1||/\d{4}\s*–\s*\d{2}(?!\d)/.test(e.d)};
  const clear=e=>!/Winter/.test(e.d)&&!span(e)&&(/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\b/.test(e.d)||per[e.fy]===1);
  const D=[];U.filter(clear).forEach(e=>{if(!D.length||D[D.length-1].key<e.key)D.push(e)});
  return D;
}
// Three puzzles, each a window of 7 neighbouring events: 2-3 to place (weakest first, never side by side), the rest as anchors
function chPuzzles(u){
  const D=chDeck(u),W=7,used=new Set(),out=[];
  if(D.length<W)return out;
  const order=shuffle(D.map((e,i)=>i)).sort((a,b)=>chWeak(D[a])-chWeak(D[b]));
  for(const i of order){
    if(out.length===3)break;
    const st=Math.max(0,Math.min(i-3,D.length-W)),idx=[...Array(W).keys()].map(k=>st+k);
    if(idx.some(k=>used.has(k)))continue;
    const win=idx.map(k=>D[k]),pick=[i-st];
    for(const k of shuffle(win.map((e,k)=>k)).sort((a,b)=>chWeak(win[a])-chWeak(win[b]))){
      if(pick.length===3)break;
      if(!pick.includes(k)&&pick.every(p=>Math.abs(p-k)>1))pick.push(k);
    }
    if(pick.length<2)continue;
    idx.forEach(k=>used.add(k));
    const cards=pick.map(k=>win[k]),anchors=win.filter((e,k)=>!pick.includes(k)),answer={};
    cards.forEach(c=>answer[c.id]=anchors.filter(a=>a.key<c.key).length);
    out.push({anchors,cards:shuffle(cards),answer,place:{},checked:false});
  }
  return out;
}
// One placed card = one answer for that event (moves up at most once a day; a wrong answer moves it back a step)
function chRecord(e,ok){
  const t=dayStr(),c=S.cards[e.id]||{box:0,due:t};
  if(ok){if(c.lc!==t){c.box=Math.min(c.box+1,5);c.due=addDays(t,INTERVALS[c.box]);c.lc=t}}
  else{c.box=Math.max(0,c.box-1);c.due=t}
  S.cards[e.id]=c;
}
function openChallenge(u){
  CH={u,puzzles:chPuzzles(u),i:0,sel:null,xp:0,right:0,total:0,done:false};
  let o=$(".cho");
  if(!o){o=document.createElement("div");o.className="cho";o.setAttribute("role","dialog");o.setAttribute("aria-label","Timeline Mini Test");document.body.appendChild(o)}
  if(!chOpen){try{history.pushState({nadyaCh:1},"")}catch(err){}}
  chOpen=true;renderCh();o.scrollTop=0;
}
function closeChallenge(){
  const o=$(".cho");if(o)o.remove();
  const u=CH?CH.u:"a";chOpen=false;CH=null;
  if(app.querySelector(".week"))home();
  if(tlOpen)openTimeline(u,null,false);
}
function chQuit(){if(history.state&&history.state.nadyaCh){try{history.back();return}catch(err){}}closeChallenge()}
function chPlace(id,g){
  const P=CH.puzzles[CH.i],from=P.place[id];
  if(g==="tray"){delete P.place[id]}
  else{
    const other=P.cards.find(c=>c.id!==id&&P.place[c.id]===g);
    if(other){if(from!=null)P.place[other.id]=from;else delete P.place[other.id]}
    P.place[id]=g;
  }
  CH.sel=null;SND.tap();renderCh();
}
function chTap(id){
  const P=CH.puzzles[CH.i];
  if(CH.sel&&CH.sel!==id&&P.place[id]!=null){chPlace(CH.sel,P.place[id]);return}
  CH.sel=CH.sel===id?null:id;SND.tap();renderCh();
}
function chCheck(){
  const P=CH.puzzles[CH.i];let n=0;P.res={};
  P.cards.forEach(c=>{const ok=P.place[c.id]===P.answer[c.id];P.res[c.id]=ok;chRecord(c,ok);if(ok){n++;CH.xp+=10;S.xp+=10}});
  P.checked=true;P.n=n;CH.right+=n;CH.total+=P.cards.length;save();
  n===P.cards.length?SND.right():SND.wrong();if(n===P.cards.length)fireworks(3,true);else if(n)fireworks(1);renderCh();
}
function renderCh(){
  const o=$(".cho");if(!o||!CH)return;
  const head=(frac,txt)=>`<div class="chhead"><button class="iconbtn" id="chclose" aria-label="Close the mini test">${CLOSE}</button><div class="lbar"><i style="width:${Math.max(4,frac*100)}%"></i></div><span class="meta">${txt}</span></div>`;
  if(!CH.puzzles.length){
    o.innerHTML=`<div class="wrapper">${head(0,"")}<div class="done-wrap">${mascot("waiting")}<h1 style="color:var(--ink)">Not enough events here yet</h1></div></div>`;
    $("#chclose").onclick=chQuit;return;
  }
  if(CH.done){
    const perfect=CH.right===CH.total;
    o.innerHTML=`<div class="wrapper">${head(1,"")}<div class="done-wrap">${mascot(perfect?"celebrate":"happy")}<h1>${perfect?"Perfect timeline!":"Mini test complete!"}</h1>
      <div class="sub">${CH.right} of ${CH.total} events in the right place</div>
      <div class="tiles" style="grid-template-columns:repeat(2,1fr)"><div class="tile" style="--c:var(--gold)"><div class="t">XP</div><div class="v">+${CH.xp}</div></div><div class="tile" style="--c:var(--green)"><div class="t">Correct</div><div class="v">${CH.right}/${CH.total}</div></div></div></div>
      <div class="foot" style="display:grid;gap:12px"><button class="btn" id="chagain">Play again</button><button class="btn ghost" id="chback">Back to the timeline</button></div></div>`;
    $("#chclose").onclick=chQuit;$("#chback").onclick=chQuit;$("#chagain").onclick=()=>{openChallenge(CH.u)};
    return;
  }
  const P=CH.puzzles[CH.i],A=P.anchors.length,N=CH.puzzles.length;
  const occ=g=>P.cards.filter(c=>(P.checked?P.answer[c.id]:P.place[c.id])===g);
  const card=c=>{let cls="chcard";if(P.checked)cls+=P.res[c.id]?" right":" wrong";else if(CH.sel===c.id)cls+=" sel";
    return `<button class="${cls}" data-card="${c.id}"${P.checked?" disabled":""}>${P.checked?`<span class="cd">${esc(c.d)}</span>`:""}${esc(c.h)}${P.checked&&!P.res[c.id]?'<span class="tag">It belongs here</span>':""}</button>`};
  const where=g=>g===0?`before ${P.anchors[0].h}`:g===A?`after ${P.anchors[A-1].h}`:`between ${P.anchors[g-1].h} and ${P.anchors[g].h}`;
  let strip="";
  for(let g=0;g<=A;g++){
    const here=occ(g);
    if(here.length)strip+=`<div class="chgap filled" data-gap="${g}">${here.map(card).join("")}</div>`;
    else if(P.checked)strip+=`<div class="chgap quiet"></div>`;
    else strip+=`<div class="chgap${CH.sel?" armed":""}" data-gap="${g}"><button class="slot" data-slot="${g}" aria-label="Place here, ${esc(where(g))}">${CH.sel?"Tap to place here":"Drop here"}</button></div>`;
    if(g<A){const a=P.anchors[g];strip+=`<div class="chanchor"><span class="d">${esc(a.d)}</span><span class="h">${esc(a.h)}</span></div>`}
  }
  const tray=P.cards.filter(c=>P.place[c.id]==null);
  let tail="";
  if(P.checked){
    const cs=P.cards.slice().sort((a,b)=>a.key-b.key);
    let items=cs;
    if(cs.length===2){const mid=P.anchors.find(a=>a.key>cs[0].key&&a.key<cs[1].key);items=mid?[cs[0],mid,cs[1]]:null}
    if(items&&items.length===3)tail=ruler(items,true);
  }else{
    tail=`<div class="chtray" data-gap="tray"><span class="lbl">${tray.length?"Place these events":"All placed. Tap Check, or move any of them"}</span>${tray.map(card).join("")}</div>`;
  }
  const title=P.checked?`<div class="chres ${P.n===P.cards.length?"ok":"no"}">${P.n===P.cards.length?rnd(["Spot on!","Perfect!","Nailed it!"]):`${P.n} of ${P.cards.length} right`}</div>`
    :`<div class="qtype">Timeline Mini Test</div><div class="qtitle">Where do these events fit?</div><div class="legend">Drag each event into the right gap, or tap it and then tap a gap.</div>`;
  o.innerHTML=`<div class="wrapper">${head((CH.i+(P.checked?1:0))/N,`${CH.i+1} of ${N}`)}${title}${P.checked?"":tail}<div class="chstrip">${strip}</div>${P.checked?tail:""}<div class="spacer"></div>
    <div class="foot"${P.checked?' style="display:grid;gap:10px"':""}>${P.checked?`<button class="btn tl ${P.n===P.cards.length?"g":"o"}" id="chtl">${TL_ICON}See ${P.cards.length>1?"them":"it"} on the timeline</button><button class="btn ${P.n===P.cards.length?"green":"orange"}" id="chnext">${CH.i+1<N?"Next puzzle":"See results"}</button>`:`<button class="btn green" id="chcheck"${tray.length?" disabled":""}>Check</button>`}</div></div>`;
  $("#chclose").onclick=chQuit;
  if(P.checked){$("#chtl").onclick=()=>{const c=P.cards.find(c=>!P.res[c.id])||P.cards[0];SND.tap();openTimeline(CH.u,c.id,"challenge")};
    $("#chnext").onclick=()=>{CH.i++;if(CH.i>=N){CH.done=true;SND.done();fireworks(CH.right===CH.total?7:2,CH.right===CH.total);if(CH.right===CH.total)confetti()}renderCh();o.scrollTop=0};return}
  $("#chcheck").onclick=chCheck;
  o.querySelectorAll(".slot").forEach(b=>b.onclick=()=>{if(CH.sel)chPlace(CH.sel,+b.dataset.slot)});
  const trayEl=o.querySelector(".chtray");trayEl.onclick=ev=>{if(ev.target.closest(".chcard"))return;if(CH.sel&&P.place[CH.sel]!=null)chPlace(CH.sel,"tray")};
  // Dragging with pointer events (works with touch in the Android app); a short press without moving is a tap
  let drag=null;
  o.querySelectorAll(".chcard").forEach(el=>{
    el.addEventListener("pointerdown",ev=>{if(ev.button>0)return;drag={id:el.dataset.card,el,x:ev.clientX,y:ev.clientY,moved:false};try{el.setPointerCapture(ev.pointerId)}catch(err){}});
    el.addEventListener("pointermove",ev=>{
      if(!drag||drag.el!==el)return;
      if(!drag.moved&&Math.hypot(ev.clientX-drag.x,ev.clientY-drag.y)<8)return;
      ev.preventDefault();
      if(!drag.moved){drag.moved=true;CH.sel=null;const g=el.cloneNode(true);g.classList.add("ghost");g.classList.remove("sel");g.removeAttribute("id");document.body.appendChild(g);drag.ghost=g;el.classList.add("dragging");o.querySelectorAll(".chgap").forEach(z=>z.classList.add("armed"))}
      drag.ghost.style.left=ev.clientX+"px";drag.ghost.style.top=ev.clientY+"px";
      const t=document.elementFromPoint(ev.clientX,ev.clientY),z=t&&t.closest(".cho [data-gap]");
      o.querySelectorAll(".over").forEach(x=>{if(x!==z)x.classList.remove("over")});if(z)z.classList.add("over");drag.zone=z;
      if(ev.clientY<100)o.scrollBy(0,-14);else if(ev.clientY>innerHeight-100)o.scrollBy(0,14);
    });
    el.addEventListener("pointerup",()=>{
      if(!drag||drag.el!==el)return;const d=drag;drag=null;
      if(d.ghost)d.ghost.remove();
      if(!d.moved){chTap(d.id);return}
      if(d.zone){const g=d.zone.dataset.gap;chPlace(d.id,g==="tray"?"tray":+g)}else renderCh();
    });
    el.addEventListener("pointercancel",()=>{if(!drag||drag.el!==el)return;if(drag.ghost)drag.ghost.remove();drag=null;renderCh()});
    el.addEventListener("click",ev=>{if(ev.detail===0)chTap(el.dataset.card)}); // keyboard
  });
}

/* ---------- fireworks ---------- */
let FW=null;
const FW_COLS=["#F4B740","#FF8A1E","#D9383A","#5B83F0","#4CC173","#FFFFFF","#B49AE0"];
// Launch n rockets that burst into sparks; big = larger bursts with a second colour
function fireworks(n=1,big=false){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  if(!FW){const cv=document.createElement("canvas");cv.setAttribute("aria-hidden","true");cv.style.cssText="position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:70";document.body.appendChild(cv);FW={cv,ctx:cv.getContext("2d"),rockets:[],sparks:[],pending:0,run:false}}
  const d=devicePixelRatio||1,W=FW.cv.width=innerWidth*d,H=FW.cv.height=innerHeight*d;
  for(let i=0;i<n;i++){
    FW.pending++;
    setTimeout(()=>{FW.pending--;
      FW.rockets.push({x:W*(0.15+Math.random()*0.7),y:H*0.98,vx:(Math.random()-.5)*W*0.002,vy:-H*(0.017+Math.random()*0.005),ty:H*(0.07+Math.random()*0.2),c:rnd(FW_COLS),c2:rnd(FW_COLS),big,d});
      SND.whoosh();
    },i*(big?260:180)+Math.random()*80);
  }
  if(!FW.run){FW.run=true;requestAnimationFrame(fwStep)}
}
function fwBurst(r){
  const n=r.big?110:70,sp=r.d*(r.big?7.5:6);
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,v=sp*(0.35+Math.random()*0.65);
    FW.sparks.push({x:r.x,y:r.y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:1,decay:0.011+Math.random()*0.012,c:r.big&&i%2?r.c2:r.c,s:r.d*(1.4+Math.random()*1.4)})}
  SND.pop();
}
function fwStep(){
  const {cv,ctx}=FW,g=FW.cv.height*0.00012;
  ctx.globalCompositeOperation="destination-out";ctx.fillStyle="rgba(0,0,0,0.28)";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.globalCompositeOperation="lighter";
  FW.rockets=FW.rockets.filter(r=>{r.x+=r.vx;r.y+=r.vy;r.vy+=g*0.6;
    ctx.fillStyle=r.c;ctx.beginPath();ctx.arc(r.x,r.y,2.2*r.d,0,7);ctx.fill();
    if(r.y<=r.ty||r.vy>=0){fwBurst(r);return false}return true});
  FW.sparks=FW.sparks.filter(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=g;p.vx*=0.985;p.vy*=0.985;p.life-=p.decay;
    if(p.life<=0)return false;ctx.globalAlpha=Math.min(1,p.life*1.4)*(Math.random()<0.08?0.4:1);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.s,0,7);ctx.fill();ctx.globalAlpha=1;return true});
  if(FW.rockets.length||FW.sparks.length||FW.pending)requestAnimationFrame(fwStep);
  else{ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,cv.width,cv.height);FW.run=false}
}

/* ---------- confetti ---------- */
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const cv=$("#fx"),ctx=cv.getContext("2d");cv.hidden=false;
  const W=cv.width=innerWidth*devicePixelRatio,H=cv.height=innerHeight*devicePixelRatio;
  const cols=["#D9383A","#F4B740","#2D5BD7","#36A256","#FF8A1E"];
  const P=Array.from({length:140},()=>({x:W/2+(Math.random()-.5)*W*.3,y:H*.35,vx:(Math.random()-.5)*W*.02,vy:-Math.random()*H*.025-H*.005,r:(4+Math.random()*5)*devicePixelRatio,c:rnd(cols),a:Math.random()*6,va:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ctx.clearRect(0,0,W,H);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=H*.0009;p.a+=p.va;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=p.c;ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r);ctx.restore()});
   if(t-t0<2800)requestAnimationFrame(f);else{ctx.clearRect(0,0,W,H);cv.hidden=true}})(t0);
}

let installEvt=null;
const isStandalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();installEvt=e;if(!L&&app.querySelector(".week"))home()});
